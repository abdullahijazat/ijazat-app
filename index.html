  --bg:#F6F1E4;
  --surface:#FFFFFF;
  --surface-2:#FBF8EF;
  --ink:#20281F;
  --ink-soft:#5B6459;
  --primary:#1F4741;
  --primary-light:#2E6259;
  --primary-dark:#12302B;
  --gold:#AE8A3B;
  --gold-light:#E7D9AE;
  --maroon:#7C2E2E;
  --maroon-light:#F3E2E0;
  --ok:#2E6259;
  --ok-light:#E1EBE4;
  --warn:#8A6C1F;
  --warn-light:#F3E9CF;
  --border:#E4D9BC;
  --shadow: 0 8px 24px -12px rgba(18,48,43,0.25);
  --radius: 14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 100% -10%, #EFE4C1 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Amiri',serif;
}
button{font-family:inherit;}
::selection{background:var(--gold-light);}

/* ---------- geometric arch divider ---------- */
.arch-divider{
  display:flex; align-items:center; gap:8px; margin:18px 0;
  color:var(--gold);
}
.arch-divider::before,.arch-divider::after{
  content:''; flex:1; height:1px; background:linear-gradient(to var(--dir,left), var(--border), transparent);
}
.arch-divider .diamond{
  width:7px;height:7px; transform:rotate(45deg);
  border:1.5px solid var(--gold); background:var(--surface);
}

/* ---------- splash ---------- */
.splash{
  height:100vh; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:14px; color:var(--primary);
}
.spinner{
  width:34px;height:34px;border-radius:50%;
  border:3px solid var(--gold-light); border-top-color:var(--gold);
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- login ---------- */
.login-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-card{
  width:100%; max-width:460px; background:var(--surface);
  border:1px solid var(--border); border-radius:22px 22px 6px 6px;
  box-shadow:var(--shadow); overflow:hidden;
}
.login-head{
  background:
    linear-gradient(180deg, rgba(18,48,43,0.92), rgba(31,71,65,0.88) 70%),
    var(--mosque-img);
  background-size: cover; background-position: center 30%;
  padding:34px 28px 60px; text-align:center; position:relative; color:#fff;
}
.login-head svg{position:absolute; bottom:-1px; right:0; width:100%; height:40px;}
.login-head .eyebrow{
  letter-spacing:.14em; font-size:11px; color:var(--gold-light); text-transform:uppercase;
}
.login-head h1{
  margin:10px 0 4px; font-size:26px; font-weight:700;
}
.login-head p{margin:0; font-size:13px; color:#D9E4DD;}
.login-body{padding:22px 28px 30px;}
.role-toggle{
  display:flex; gap:8px; background:var(--surface-2); padding:5px; border-radius:12px; margin-bottom:20px;
  border:1px solid var(--border);
}
.role-toggle button{
  flex:1; border:none; background:transparent; padding:10px 8px; border-radius:9px;
  font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer; transition:.15s;
}
.role-toggle button.active{background:var(--primary); color:#fff;}
label{display:block; font-size:12.5px; color:var(--ink-soft); margin:0 0 6px; font-weight:500;}
input[type=text],input[type=password],input[type=email],input[type=date],input[type=number],select,textarea{
  width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:10px;

/* ---------------- password hashing (client-side) ---------------- */
// نستخدم SHA-256 عبر Web Crypto عند توفرها (يتطلب فتح الملف عبر https أو من مضيف محلي آمن).
// عند تعذّر ذلك (مثل فتح الملف مباشرة بصيغة file:// في بعض المتصفحات) نستخدم بديلاً بسيطًا
// حتى لا يتعطل تسجيل الدخول، مع العلم أن الحماية الحقيقية تعتمد أيضًا على رمز الحماية (Token).
const HASH_ITERATIONS = 100000; // تكرار PBKDF2 يبطئ محاولات تخمين كلمات المرور من أي هاش مسرّب

function randomHex_(numBytes){
  const arr = new Uint8Array(numBytes);
  window.crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function hexToBytes_(hex){
  const bytes = new Uint8Array(hex.length/2);
  for(let i=0;i<bytes.length;i++){ bytes[i] = parseInt(hex.substr(i*2,2),16); }
  return bytes;
}
async function deriveHex_(pw, saltHex){
  const keyMaterial = await window.crypto.subtle.importKey('raw', new TextEncoder().encode(pw), {name:'PBKDF2'}, false, ['deriveBits']);
  const bits = await window.crypto.subtle.deriveBits({name:'PBKDF2', salt:hexToBytes_(saltHex), iterations:HASH_ITERATIONS, hash:'SHA-256'}, keyMaterial, 256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// النسخة الجديدة المقوّاة (ملح عشوائي لكل حساب + تكرار اشتقاق) — تُستخدم لأي كلمة مرور تُنشأ أو تُعاد من الآن فصاعدًا
async function hashPassword(pw){
  try{
    if(window.crypto && window.crypto.subtle){
      const salt = randomHex_(16);
      const derived = await deriveHex_(pw, salt);
      return 'v2_' + salt + '_' + derived;
    }
  }catch(e){}
  return await hashPasswordLegacy(pw);
}

// النسخة القديمة (هاش واحد بدون ملح) — تبقى فقط للتحقق من حسابات أُنشئت قبل هذا التحديث
async function hashPasswordLegacy(pw){
  try{
    if(window.crypto && window.crypto.subtle){
      const enc = new TextEncoder().encode(pw);
      const buf = await window.crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h = 0;
  const s = 'fallback:' + pw;
  for(let i=0;i<s.length;i++){ h = (Math.imul(31,h) + s.charCodeAt(i))|0; }
  return 'fb_' + (h>>>0).toString(16);
}

// يتحقق من كلمة المرور مهما كانت صيغة الهاش المخزّنة (جديدة أو قديمة)، لضمان عمل الحسابات الحالية دون انقطاع
async function verifyPassword(pw, stored){
  if(!stored) return false;
  if(stored.indexOf('v2_')===0){
    const rest = stored.slice(3);
    const sep = rest.indexOf('_');
    if(sep===-1) return false;
    const salt = rest.slice(0, sep), expected = rest.slice(sep+1);
    try{ return (await deriveHex_(pw, salt)) === expected; }
    catch(e){ return false; }
  }
  return (await hashPasswordLegacy(pw)) === stored;
}

// حدّ خلية واحدة في Google Sheets هو 50,000 حرف. لتفادي الاصطدام بهذا الحد كلما كبرت
// البيانات (مثل عدد كبير من الطلاب)، نُقسّم أي قيمة كبيرة تلقائيًا على عدة "خلايا" (مفاتيح)
// ونعيد تجميعها عند القراءة — بدل تخزينها كلها في خلية واحدة محدودة السعة.
const CHUNK_SIZE = 40000; // هامش أمان تحت حد الـ50,000 (لا قيد عليه هنا لأنه يُرسل داخل POST وليس رابطًا)

// Apps Script (ContentService) لا يملك طريقة مدعومة لإرسال رؤوس CORS، لذلك أي "fetch" عادي
// لقراءة البيانات من نطاق مختلف (مثل GitHub Pages) يُحجب من المتصفح. الحل الرسمي المعتمد من
// جوجل نفسها لهذه الحالة: تقنية JSONP (تحميل الرابط كـ"سكربت" بدل طلب Fetch)، وهي لا تخضع
// لقيود CORS إطلاقًا لأنها ببساطة عنصر <script> عادي كأي مكتبة خارجية.
function jsonp_(url){
  return new Promise((resolve, reject)=>{
    const cbName = '_jsonp_cb_' + Date.now().toString(36) + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let settled = false;
    // التنظيف يحدث بعد جولة أحداث كاملة (وليس فورًا داخل الاستدعاء نفسه) لتفادي أي تعارض توقيت
    const finish = (fn)=>{
      if(settled) return; settled = true;
      fn();
      setTimeout(()=>{
        try{ delete window[cbName]; }catch(e){}
        if(script.parentNode) script.parentNode.removeChild(script);
      }, 0);
    };
    window[cbName] = (data)=>{ finish(()=>resolve(data)); };
    script.onerror = ()=>{ finish(()=>reject(new Error('jsonp_network_error'))); };
    script.src = url + (url.indexOf('?')>-1?'&':'?') + 'callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(()=>{ finish(()=>reject(new Error('jsonp_timeout'))); }, 20000);
  });
}
// نفس jsonp_ لكن بمحاولتين إضافيتين تلقائيًا عند أي فشل عابر (شبكة بطيئة، تعارض توقيت نادر...)
async function jsonpRetry_(url){
  for(let attempt=0; attempt<3; attempt++){
    try{ return await jsonp_(url); }
    catch(e){ if(attempt===2) throw e; }
  }
}

async function apiGetRaw_(key){
  const u = `${API.url}?action=get&key=${encodeURIComponent(key)}${API.token?('&token='+encodeURIComponent(API.token)):''}`;
  const data = await jsonpRetry_(u);
  if(!data || data.error) return undefined;
  return (data.value!==undefined && data.value!==null) ? data.value : undefined;
}
// الكتابة تبقى عبر POST عادي (لا قيد طول رابط)، لكن دون قراءة الاستجابة مباشرة (Fetch عبر
// وضع no-cors يرسل الطلب وينفّذه Apps Script فعليًا، لكن لا يسمح المتصفح بقراءة ردّه لنفس
// سبب CORS أعلاه) — لذلك نتحقق من نجاح الحفظ فعليًا عبر قراءة تأكيدية خفيفة (JSONP) بعدها.
async function apiSetRaw_(key, rawString){
  try{
    await fetch(API.url, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'set', key, value: rawString, token: API.token })
    });
  }catch(e){ return false; }
  // تحقّق فعلي أن الكتابة وصلت وتمّت (وليس مجرد افتراض نجاح لعدم وجود خطأ شبكة)
  try{
    const check = await apiGetRaw_(key);
    return check===rawString;
  }catch(e){ return false; }
}

// نظام تخزين "ذرّي": كل عملية حفظ تكتب نسخة جديدة كاملة تحت مفاتيح جديدة تمامًا (لا تُكتب فوق
// القديمة أبدًا)، ولا يتم "تحويل" القراء للنسخة الجديدة إلا بخطوة أخيرة واحدة بعد نجاح كل شيء
// 100%. هذا يضمن أن أي قارئ يرى دائمًا إما النسخة القديمة كاملة أو الجديدة كاملة — لا يمكن أبدًا
// أن يرى مزيجًا فاسدًا من الاثنين، حتى لو تعطّل الحفظ في منتصفه تمامًا (سبب حقيقي شوهد سابقًا).
function randVersion_(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

async function apiGet(key){
  try{
    const version = await apiGetRaw_(`${key}__current_version`);
    if(version){
      const chunksRaw = await apiGetRaw_(`${key}__v${version}__chunks`);
      const chunkCount = chunksRaw? parseInt(chunksRaw,10): 0;
      if(chunkCount>0){
        const parts = await Promise.all(Array.from({length:chunkCount}, (_,i)=>apiGetRaw_(`${key}__v${version}__chunk_${i}`)));
        if(parts.some(p=>p===undefined)) return null;
        return JSON.parse(parts.join(''));
      }
      return null;
    }
    // توافق مع بيانات قديمة أُنشئت قبل هذا التحديث (نظام التجزئة السابق بدون إصدارات)
    const legacyChunksRaw = await apiGetRaw_(key+'__chunks');
    const legacyChunkCount = legacyChunksRaw? parseInt(legacyChunksRaw,10): 0;
    if(legacyChunkCount>0){
      const parts = await Promise.all(Array.from({length:legacyChunkCount}, (_,i)=>apiGetRaw_(`${key}__chunk_${i}`)));
      if(parts.some(p=>p===undefined)) return null;
      return JSON.parse(parts.join(''));
    }
    const raw = await apiGetRaw_(key);
    if(raw===undefined || raw==='') return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
async function apiSet(key, value){
  try{
    const json = JSON.stringify(value);
    const version = randVersion_();
    const parts = [];
    for(let i=0;i<json.length;i+=CHUNK_SIZE) parts.push(json.slice(i,i+CHUNK_SIZE));
    if(!parts.length) parts.push('');
    // 1) نكتب كل الأجزاء الجديدة أولًا تحت مفاتيح جديدة كليًا — لا تؤثر على ما يقرأه أي شخص الآن
    for(let i=0;i<parts.length;i++){
      const ok = await apiSetRaw_(`${key}__v${version}__chunk_${i}`, parts[i]);
      if(!ok) return false; // فشل هنا = لا ضرر، النسخة القديمة تبقى "الحقيقة" كما هي
    }
    const okCount = await apiSetRaw_(`${key}__v${version}__chunks`, String(parts.length));
    if(!okCount) return false;
    // 2) نقطة التحويل الذرّية الوحيدة: بمجرد نجاح هذا السطر فقط، يرى كل قارئ جديد النسخة الجديدة كاملة
    return await apiSetRaw_(`${key}__current_version`, version);
  }catch(e){ return false; }
}
async function apiTest(){
  try{
    const u = `${API.url}?action=get&key=__ping__${API.token?('&token='+encodeURIComponent(API.token)):''}`;
    const data = await jsonpRetry_(u);
    return !!data && !data.error;
  }catch(e){ return false; }
}

function saveSession(){ if(session) lsSet('ijazat_session', JSON.stringify(session)); else lsDel('ijazat_session'); }

let apiConfigured = false;
let apiConnectionError = false;

let dataFullyLoaded = false;

async function init(){
  resolveApiConfig();
  apiConfigured = !!API.url;
  if(!apiConfigured){ ready = true; render(); return; }

  // المرحلة الحرجة (تحجب الظهور): نجلب فقط ما يلزم لعرض شاشة الدخول — الحسابات (config).
  // بقية البيانات (الخطط/التحضير/الحصاد/الاختبارات) تُحمَّل بعدها في الخلفية دون تعطيل الظهور.
  let config = null;
  for(let attempt=0; attempt<3 && config===null; attempt++){
    config = await apiGet('config');
  }
  if(config===null){
    const ok = await apiTest();
    if(!ok){ apiConnectionError = true; ready = true; render(); return; }
    config = await apiGet('config'); // نجح ping لكن فشلت قراءة config، حاول أخيرة
  }
  if(config===null){ apiConnectionError = true; ready = true; render(); return; }
  apiConnectionError = false;

  DB.config = config;
  if(!DB.config.qiraahOptions || !DB.config.qiraahOptions.length) DB.config.qiraahOptions = [...DEFAULT_QIRAAH_OPTIONS];
  if(!DB.config.planTypes || !DB.config.planTypes.length) DB.config.planTypes = [...DEFAULT_PLAN_TYPES];
  if(!DB.config.supervisors) DB.config.supervisors = [];
  try{ session = JSON.parse(lsGet('ijazat_session')||'null'); }catch(e){ session = null; }
  // تحقق أن الحساب المحفوظ محليًا ما زال موجودًا فعليًا في قاعدة البيانات (لم يُحذف)
  if(session){
    if(session.role==='supervisor' && !DB.config.supervisors.find(s=>s.id===session.id)){
      session=null;
    }else if(session && session.role==='reciter'){
      const rAcc = DB.config.reciters.find(r=>r.id===session.reciterId);
      if(!rAcc) session=null; else session.isExaminer = !!rAcc.isExaminer; // مزامنة صلاحية المختبر مع أحدث بيانات
    }
    if(!session) saveSession();
  }
  ready = true;
  currentTab = session ? (session.role==='supervisor' ? 'overview' : 'my-circles') : null;
  render(); // ← البرنامج يظهر الآن (شاشة الدخول أو لوحة التحكم)، بدون انتظار بقية البيانات

  // المرحلة الثانية (خلفية): تكتمل غالبًا أثناء كتابة المستخدم لبيانات الدخول.
  // مُغلَّفة بالكامل بمعالجة أخطاء صريحة حتى لا تبقى رسالة "جاري التحميل" عالقة للأبد لو فشل شيء.
  try{
    const [plans, attendance, harvest, examinations] = await Promise.all([
      apiGet('plans'), apiGet('attendance'), apiGet('harvest'), apiGet('examinations')
    ]);
    DB.plans = plans || [];
    DB.attendance = attendance || [];
    DB.harvest = harvest || [];
    DB.examinations = examinations || [];
  }catch(e){
    // لا نترك المستخدم عالقًا برسالة "جاري التحميل" للأبد — نكمل ببيانات فارغة ونُنبّه بلطف
    DB.plans = DB.plans || []; DB.attendance = DB.attendance || [];
    DB.harvest = DB.harvest || []; DB.examinations = DB.examinations || [];
    if(session) showToast('تعذّر تحميل بعض البيانات (الخطط/التحضير...) — حاول تحديث الصفحة');
  }finally{
    dataFullyLoaded = true;
    if(session) render(); // إن كان قد دخل بالفعل، حدّث الشاشة الآن (سواء نجحت البيانات أو فشلت)
  }
}

/* ---------------- lookups ---------------- */
const getSupervisor = id => DB.config.supervisors.find(s=>s.id===id);
const getReciter = id => DB.config.reciters.find(r=>r.id===id);
const getCircle = id => DB.config.circles.find(c=>c.id===id);
const getPeriod = id => PRAYER_PERIODS.find(p=>p.id===id);
const getStudent = id => DB.config.students.find(s=>s.id===id);
const circlesOfReciter = rid => DB.config.circles.filter(c=>c.reciterId===rid);
// الطالب أصبح بإمكانه الانتساب لأكثر من حلقة عبر enrollments
const studentsOfCircle = cid => DB.config.students.filter(s=>(s.enrollments||[]).some(en=>en.circleId===cid));
// طلاب الحلقة المسجّلين في فترة معيّنة تحديدًا (أو كل طلاب الحلقة إن لم يكن للطالب فترة محددة أصلاً)
function studentsOfCircleAndPeriod(circleId, periodId){
  return DB.config.students.filter(s=>{
    const en = enrollmentOf(s, circleId);
    if(!en) return false;
    if(!periodId) return true;
    return !en.periodId || en.periodId===periodId;
  });
}
const enrollmentOf = (student, circleId) => (student.enrollments||[]).find(en=>en.circleId===circleId);
function circleLabel(c){ const r=getReciter(c.reciterId); return (c.number?('حلقة '+c.number+' — '):'') + c.name + (r? ' — ' + r.name : ''); }
function circlePeriodsLabel(c){ return (c.periodIds||[]).map(pid=>getPeriod(pid)?.name).filter(Boolean).join('، ') || '—'; }
function absenceDaysCount(studentId, circleId){
  return DB.attendance.filter(a=>a.studentId===studentId && a.circleId===circleId && a.status==='غائب').length;
}
const TOTAL_MUSHAF_PAGES = 604;
// أحدث صفحة مسجّلة لطالب داخل حلقة معيّنة من التحضير اليومي (بحسب التاريخ، ثم معرّف السجل)
function latestAttendancePageFor(studentId, circleId){
  const rows = DB.attendance.filter(a=>a.studentId===studentId && a.circleId===circleId && a.pageNumber);
  if(!rows.length) return null;
  rows.sort((a,b)=> (a.date||'').localeCompare(b.date||'') || (a.id||'').localeCompare(b.id||''));
  return rows[rows.length-1];
}
// تدرّج لوني: أحمر (بداية) ← أصفر (منتصف) ← أخضر ← أخضر داكن (عند آخر صفحة)
function progressColor(pct){
  pct = Math.max(0, Math.min(100, pct));
  const hue = pct * 1.2; // 0=أحمر, 60=أصفر, 120=أخضر
  const light = pct <= 92 ? 46 : 46 - (pct-92)*2.2; // يغمق تدريجيًا قرب الختم
  return `hsl(${hue.toFixed(0)}, 72%, ${Math.max(20,light).toFixed(0)}%)`;
}

function render(){
  const app = document.getElementById('app');
  if(!ready){ app.innerHTML = `<div class="splash"><div class="spinner"></div><div>جاري تحميل بيانات الشعبة…</div></div>`; return; }
  if(!apiConfigured || apiConnectionError){ app.innerHTML = renderSetup(); attachSetupEvents(); return; }
  if(!session){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }

  // تحديث خفيف: إن كان الهيكل (القائمة الجانبية) معروضًا بالفعل، نحدّث فقط المحتوى وعنوان
  // الصفحة وحالة القائمة النشطة، بدل إعادة بناء كل شيء من الصفر — يُسرّع التنقل بشكل ملحوظ.
  const existingContent = document.getElementById('content');
  const existingSidebar = document.querySelector('.sidebar');
  if(existingContent && existingSidebar){
    existingContent.innerHTML = (!dataFullyLoaded ? `<div class="hint" style="background:var(--warn-light);color:var(--warn);padding:8px 12px;border-radius:10px;margin-bottom:14px;">جاري تحميل بقية البيانات (الخطط والتحضير والحصاد) في الخلفية…</div>` : '') + (session.role==='supervisor' ? renderSupervisorTab() : renderReciterTab());
    const titleEl = document.querySelector('.topbar h1');
    if(titleEl) titleEl.textContent = navItemsFor(session.role).find(i=>i[0]===currentTab)?.[1] || '';
    const subEl = document.querySelector('.topbar .sub');
    if(subEl) subEl.textContent = todayLabel();
    document.querySelectorAll('.nav button[data-tab]').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab===currentTab);
    });
    existingSidebar.classList.toggle('open', !!mobileMenuOpen);
    const backdropEl = document.getElementById('mobileBackdrop');
    if(backdropEl) backdropEl.classList.toggle('show', !!mobileMenuOpen);
    return;
  }

  app.innerHTML = renderShell();
  attachShellEvents();
}

function attachSetupEvents(){
  const form = document.getElementById('setupForm');
  if(!form) return;
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const url = (fd.get('url')||'').toString().trim();
    const token = (fd.get('token')||'').toString().trim();
    if(!url){ setupError='يرجى إدخال الرابط'; render(); return; }
    lsSet('ijazat_api_url', url);
    lsSet('ijazat_api_token', token);
    API.url = url; API.token = token;
    setupTesting = true; setupError=''; render();
    const ok = await apiTest();
    setupTesting = false;
    if(!ok){ apiConnectionError = true; setupError='تعذّر الاتصال بهذا الرابط. تحقق منه ومن إعدادات النشر ثم حاول مجددًا.'; render(); return; }
    apiConnectionError = false; apiConfigured = true;
    ready = false; render();
    await init();
  });
}

        `}

}

function attachLoginEvents(){
  const bootstrapForm = document.getElementById('bootstrapForm');
  if(bootstrapForm){
    bootstrapForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(bootstrapForm);
      const name=(fd.get('name')||'').toString().trim();
      const username=(fd.get('username')||'').toString().trim();
      const password=(fd.get('password')||'').toString();
      const password2=(fd.get('password2')||'').toString();
      if(!name||!username||!password){ loginError='يرجى تعبئة جميع الحقول'; render(); return; }
      if(password!==password2){ loginError='كلمتا المرور غير متطابقتين'; render(); return; }
      const passwordHash = await hashPassword(password);
      const rec = {id:uid(), name, username, passwordHash};
      DB.config.supervisors.push(rec);
      await saveConfig();
      session = { role:'supervisor', name:rec.name, id:rec.id };
      saveSession();
      currentTab='overview'; render();
    });
  }

  const form = document.getElementById('loginForm');
  if(form){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(Date.now() < loginLockUntil){
        const secs = Math.ceil((loginLockUntil - Date.now())/1000);
        loginError = `محاولات كثيرة فاشلة. يرجى الانتظار ${secs} ثانية ثم أعد المحاولة.`; render(); return;
      }
      const fd = new FormData(form);
      const username = (fd.get('username')||'').toString().trim();
      const password = (fd.get('password')||'').toString();
      if(!username||!password){ loginError='يرجى إدخال البريد الإلكتروني أو اسم المستخدم وكلمة المرور'; render(); return; }

      let ok = false, matchedAccount = null, isSupervisor = false;
      const supAcc = DB.config.supervisors.find(s=>s.username===username);
      if(supAcc && await verifyPassword(password, supAcc.passwordHash)){
        ok = true; matchedAccount = supAcc; isSupervisor = true;
      }else{
        const r = DB.config.reciters.find(r=>r.username===username || r.email===username);
        if(r && r.passwordHash && await verifyPassword(password, r.passwordHash)){
          ok = true; matchedAccount = r; isSupervisor = false;
        }
      }

      if(!ok){
        loginAttempts++;
        if(loginAttempts>=5){ loginLockUntil = Date.now()+30000; loginAttempts=0; }
        loginError='بيانات الدخول غير صحيحة'; render(); return;
      }
      loginAttempts = 0;

      // ترقية صامتة لأي هاش قديم (من قبل هذا التحديث) لصيغة أقوى، دون مطالبة المستخدم بأي شيء
      if(matchedAccount.passwordHash.indexOf('v2_')!==0){
        matchedAccount.passwordHash = await hashPassword(password);
        saveConfig();
      }

      if(isSupervisor) session = { role:'supervisor', name:matchedAccount.name, id:matchedAccount.id };
      else session = { role:'reciter', name:matchedAccount.name, reciterId:matchedAccount.id, isExaminer:!!matchedAccount.isExaminer };

      saveSession();
      currentTab = session.role==='supervisor' ? 'overview' : 'my-circles';
      render();
    });
  }
}

function renderSupervisorTab(){
  switch(currentTab){
    case 'overview': return tplOverview();
    case 'reciters': return tplReciters();
    case 'circles': return tplCircles();
    case 'students': return tplStudents();
    case 'import': return tplImport();
    case 'planOptions': return tplPlanOptions();
    case 'supervisors': return tplSupervisors();
    case 'alerts': return tplAlerts();
    case 'khatmeen': return tplKhatmeenSupervisor();
    case 'examCommittee': return tplExamCommitteeSupervisor();
    case 'tracking': return tplTracking();
    case 'change-password': return tplChangePassword();
    default: return tplOverview();
  }
}

function tplOverview(){
  const c = DB.config;

  const circlesByTrack = t => c.circles.filter(ci=>(ci.track||CIRCLE_TRACKS[0])===t);
  const reciterCountForTrack = t => new Set(circlesByTrack(t).map(ci=>ci.reciterId)).size;
  const studentCountForTrack = t => {
    const circleIds = new Set(circlesByTrack(t).map(ci=>ci.id));
    return c.students.filter(s=>(s.enrollments||[]).some(en=>circleIds.has(en.circleId))).length;
  };

  const usedPeriodIds = new Set(c.circles.flatMap(ci=>ci.periodIds||[]));

  // عدد الطلاب (تسجيلات) لكل قراءة
  const qiraahCounts = {};
  c.students.forEach(s=>(s.enrollments||[]).forEach(en=>{
    if(!en.qiraah) return;
    qiraahCounts[en.qiraah] = (qiraahCounts[en.qiraah]||0)+1;
  }));
  const qiraahRows = Object.entries(qiraahCounts).sort((a,b)=>b[1]-a[1]);

  // إجمالي تقارير الحصاد لكل مسار ولكل فترة (مجموع الحاضرين المرفوع من المقرئين)
  const harvestAgg = {};
  DB.harvest.forEach(h=>{
    const ci = getCircle(h.circleId); if(!ci) return;
    const track = ci.track||CIRCLE_TRACKS[0];
    const key = track+'|'+h.periodId;
    if(!harvestAgg[key]) harvestAgg[key] = {track, periodId:h.periodId, reports:0, present:0};
    harvestAgg[key].reports++;
    harvestAgg[key].present += (h.presentCount||0);
  });
  const harvestRows = Object.values(harvestAgg).sort((a,b)=> a.track.localeCompare(b.track) || (getPeriod(a.periodId)?.name||'').localeCompare(getPeriod(b.periodId)?.name||''));

  return `
  <div class="grid g-4">
    <div class="stat-card"><div class="num">${c.circles.length}</div><div class="lbl">عدد الحلقات</div></div>
    <div class="stat-card"><div class="num">${c.reciters.length}</div><div class="lbl">عدد المقرئين</div></div>
    <div class="stat-card"><div class="num">${c.students.length}</div><div class="lbl">عدد الطلاب</div></div>
    <div class="stat-card"><div class="num">${usedPeriodIds.size} / ${PRAYER_PERIODS.length}</div><div class="lbl">عدد الفترات المستخدمة إجمالًا</div></div>
  </div>

  <div class="arch-divider"><span class="diamond"></span></div>

  <div class="panel">
    <div class="panel-head"><h3>التوزيع حسب المسار</h3></div>
    <table><thead><tr><th>المسار</th><th>عدد الحلقات</th><th>عدد المقرئين</th><th>عدد الطلاب</th></tr></thead><tbody>
      ${CIRCLE_TRACKS.map(t=>`<tr>
        <td><b>${esc(t)}</b></td>
        <td>${circlesByTrack(t).length}</td>
        <td>${reciterCountForTrack(t)}</td>
        <td>${studentCountForTrack(t)}</td>
      </tr>`).join('')}
    </tbody></table>
  </div>

  <div class="grid g-2">
    <div class="panel">
      <div class="panel-head"><h3>عدد الطلاب لكل قراءة</h3></div>
      ${!qiraahRows.length ? emptyState('لا توجد بيانات قراءات بعد','ستظهر هنا بعد تحديد قراءة كل طالب.') : `
      <table><thead><tr><th>القراءة</th><th>عدد التسجيلات</th></tr></thead><tbody>
        ${qiraahRows.map(([q,n])=>`<tr><td>${esc(q)}</td><td>${n}</td></tr>`).join('')}
      </tbody></table>`}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>إجمالي الحصاد لكل فترة ومسار</h3></div>
      ${!harvestRows.length ? emptyState('لا توجد تقارير حصاد بعد','') : `
      <table><thead><tr><th>المسار</th><th>الفترة</th><th>عدد التقارير</th><th>إجمالي الحاضرين</th></tr></thead><tbody>
        ${harvestRows.map(r=>`<tr><td>${esc(r.track)}</td><td>${esc(getPeriod(r.periodId)?.name||'—')}</td><td>${r.reports}</td><td>${r.present}</td></tr>`).join('')}
      </tbody></table>`}
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>إحصائيات لجنة الاختبار</h3><span class="count-badge">${DB.examinations.length}</span></div>
    ${!DB.examinations.length ? emptyState('لا توجد نتائج اختبارات مسجّلة بعد','ستظهر هنا بمجرد أن يبدأ المقرئون المخوّلون بتسجيل نتائج الاختبار.') : (()=>{
      const total = DB.examinations.length;
      const passedCount = DB.examinations.filter(x=>x.passed).length;
      const failedCount = total - passedCount;
      const recommendCount = DB.examinations.filter(x=>x.recommendation===EXAM_RECOMMENDATIONS[0]).length;
      const passRate = total? Math.round((passedCount/total)*100) : 0;
      return `
      <div class="grid g-4">
        <div class="stat-card"><div class="num">${total}</div><div class="lbl">إجمالي المختبَرين</div></div>
        <div class="stat-card"><div class="num">${passedCount}</div><div class="lbl">مجتازون</div></div>
        <div class="stat-card"><div class="num">${failedCount}</div><div class="lbl">غير مجتازين</div></div>
        <div class="stat-card"><div class="num">${passRate}%</div><div class="lbl">نسبة الاجتياز العامة</div></div>
      </div>
      <div class="hint" style="margin-top:12px;">عدد من أوصت اللجنة بتسجيلهم في حلقات الإجازات: <b>${recommendCount}</b></div>`;
    })()}
  </div>

  <div class="grid g-2">
    <div class="panel">
      <div class="panel-head"><h3>آخر الخطط المسجّلة</h3><span class="count-badge">${DB.plans.length}</span></div>
      ${renderPlansMiniTable(DB.plans.slice(-6).reverse())}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>آخر تقارير الحصاد</h3><span class="count-badge">${DB.harvest.length}</span></div>
      ${renderHarvestMiniTable(DB.harvest.slice(-6).reverse())}
    </div>
  </div>`;
}

  if(!rows.length) return emptyState('لا توجد خطط مسجّلة بعد','ستظهر هنا الخطط بمجرد أن يبدأ المقرئون بإدخالها.');
  return `<table><thead><tr><th>الطالب</th><th>الفترة</th><th>مقدار القراءة</th><th>التاريخ</th></tr></thead><tbody>
    ${rows.map(p=>{

function renderHarvestMiniTable(rows){

function buildTemplateWorkbook(){
  const wb = XLSX.utils.book_new();
  const wsR = XLSX.utils.aoa_to_sheet([['الاسم','اسم المستخدم','البريد الإلكتروني','كلمة المرور'],['مثال: محمد العتيبي','mohammed','mohammed@example.com','1234']]);
  const wsC = XLSX.utils.aoa_to_sheet([['رقم الحلقة','اسم الحلقة','اسم المقرئ','المسار','الفترات'],['12','حلقة التحفيظ الأولى','محمد العتيبي','مباشر','الفجر،العصر']]);
  const wsS = XLSX.utils.aoa_to_sheet([['اسم الطالب','رقم التسجيل','الجنسية','رقم الحلقة','الفترة','المستوى','أين وصل','القراءة'],['مثال: عبدالله أحمد','10023','سعودي','12','العصر','حافظ 5 أجزاء','سورة الكهف','حفص عن عاصم']]);
  XLSX.utils.book_append_sheet(wb, wsR, 'المقرئون');
  XLSX.utils.book_append_sheet(wb, wsC, 'الحلقات');
  XLSX.utils.book_append_sheet(wb, wsS, 'الطلاب');
  return wb;
}

function findPeriodIdByName(name){
  const n = (name||'').toString().trim();
  const p = PRAYER_PERIODS.find(p=>p.name===n);
  return p ? p.id : null;
}

async function processImportFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const errors = [];
  let addedReciters=0, addedCircles=0, addedStudents=0;

  const getSheetRows = name => {
    const ws = wb.Sheets[name];
    if(!ws) return null;
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    return rows.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));
  };

  const reciterRows = getSheetRows('المقرئون');
  const circleRows = getSheetRows('الحلقات');
  const studentRows = getSheetRows('الطلاب');

  if(reciterRows===null && circleRows===null && studentRows===null){
    errors.push('لم يتم العثور على أي ورقة بالأسماء المطلوبة (المقرئون / الحلقات / الطلاب). تأكد من أسماء الأوراق.');
    return {reciters:0, circles:0, students:0, errors};
  }

  // 1) المقرئون
  (reciterRows||[]).forEach((row, i)=>{
    const name = (row[0]||'').toString().trim();
    const username = (row[1]||'').toString().trim();
    const email = (row[2]||'').toString().trim();
    const password = (row[3]||'').toString().trim();
    if(!name || !username || !email || !password){ errors.push(`المقرئون، صف ${i+2}: بيانات ناقصة، تم التجاهل.`); return; }
    if(DB.config.reciters.some(r=>r.username===username)){ errors.push(`المقرئون، صف ${i+2}: اسم المستخدم "${username}" مستخدم مسبقًا، تم التجاهل.`); return; }
    if(DB.config.reciters.some(r=>r.email===email)){ errors.push(`المقرئون، صف ${i+2}: البريد "${email}" مستخدم مسبقًا، تم التجاهل.`); return; }
    // كلمة المرور ستُشفّر لاحقًا دفعة واحدة (انظر أدناه)
    DB.config.reciters.push({id:uid(), name, username, email, passwordHash:null, __pendingPassword:password});
    addedReciters++;
  });

  // 2) الحلقات
  (circleRows||[]).forEach((row, i)=>{
    const number = (row[0]||'').toString().trim();
    const name = (row[1]||'').toString().trim();
    const reciterName = (row[2]||'').toString().trim();
    const track = (row[3]||'').toString().trim() || CIRCLE_TRACKS[0];
    const periodsRaw = (row[4]||'').toString().trim();
    if(!number || !name || !reciterName){ errors.push(`الحلقات، صف ${i+2}: بيانات ناقصة، تم التجاهل.`); return; }
    const matches = DB.config.reciters.filter(r=>r.name.trim()===reciterName);
    if(!matches.length){ errors.push(`الحلقات، صف ${i+2}: لم يتم إيجاد مقرئ باسم "${reciterName}"، تم التجاهل.`); return; }
    if(matches.length>1){ errors.push(`الحلقات، صف ${i+2}: يوجد أكثر من مقرئ باسم "${reciterName}"، يرجى استخدام اسم فريد لكل مقرئ. تم التجاهل.`); return; }
    const reciter = matches[0];
    if(!CIRCLE_TRACKS.includes(track)){ errors.push(`الحلقات، صف ${i+2}: قيمة المسار "${track}" غير معروفة، استُخدم "${CIRCLE_TRACKS[0]}" بدلاً منها.`); }
    const periodIds = periodsRaw.split(/[،,]/).map(s=>findPeriodIdByName(s)).filter(Boolean);
    if(periodsRaw && !periodIds.length){ errors.push(`الحلقات، صف ${i+2}: لم يتم التعرف على أي فترة من "${periodsRaw}".`); }

    const existing = DB.config.circles.find(c=>c.number===number);
    if(existing){
      // دمج التكرار: نضيف الفترات الجديدة لنفس الحلقة الموجودة بدل رفض الصف
      const merged = new Set([...(existing.periodIds||[]), ...periodIds]);
      existing.periodIds = Array.from(merged);
      if(existing.reciterId!==reciter.id){
        errors.push(`الحلقات، صف ${i+2}: رقم الحلقة "${number}" مكرر بمقرئ مختلف ("${reciterName}") — تم دمج الفترات فقط مع المقرئ الأصلي للحلقة، ولم يُغيَّر المقرئ.`);
      }
      return;
    }
    DB.config.circles.push({id:uid(), name, number, reciterId:reciter.id, track:CIRCLE_TRACKS.includes(track)?track:CIRCLE_TRACKS[0], periodIds});
    addedCircles++;
  });

  // 3) الطلاب
  (studentRows||[]).forEach((row, i)=>{
    const name = (row[0]||'').toString().trim();
    const regNumber = (row[1]||'').toString().trim();
    const nationality = (row[2]||'').toString().trim();
    const circleNumber = (row[3]||'').toString().trim();
    const periodName = (row[4]||'').toString().trim();
    const level = (row[5]||'').toString().trim();
    const progress = (row[6]||'').toString().trim();
    const qiraah = (row[7]||'').toString().trim();
    if(!name || !circleNumber){ errors.push(`الطلاب، صف ${i+2}: بيانات ناقصة، تم التجاهل.`); return; }
    const circle = DB.config.circles.find(c=>c.number===circleNumber);
    if(!circle){ errors.push(`الطلاب، صف ${i+2}: لم يتم إيجاد حلقة برقم "${circleNumber}"، تم التجاهل.`); return; }
    const periodId = periodName ? findPeriodIdByName(periodName) : null;
    if(periodName && !periodId){ errors.push(`الطلاب، صف ${i+2}: لم يتم التعرف على الفترة "${periodName}".`); }
    let student = regNumber ? DB.config.students.find(s=>s.regNumber===regNumber) : null;
    if(student){
      if(!student.enrollments.some(en=>en.circleId===circle.id)){
        student.enrollments.push({circleId:circle.id, level, progress, qiraah, periodId});
      }
    }else{
      DB.config.students.push({id:uid(), name, regNumber, nationality, enrollments:[{circleId:circle.id, level, progress, qiraah, periodId}]});
    }
    addedStudents++;
  });

  // تشفير كلمات مرور المقرئين المُضافين دفعة واحدة
  for(const r of DB.config.reciters){
    if(r.__pendingPassword){
      r.passwordHash = await hashPassword(r.__pendingPassword);
      delete r.__pendingPassword;
    }
  }

  let saved = true;
  if(addedReciters||addedCircles||addedStudents) saved = await saveConfig();
  return {reciters:addedReciters, circles:addedCircles, students:addedStudents, errors, saved};
}

function tplAlerts(){

  const absenceRows = [];
  DB.config.students.forEach(s=>{
    (s.enrollments||[]).forEach(en=>{
      const count = absenceDaysCount(s.id, en.circleId);
      if(count >= ABSENCE_ALERT_THRESHOLD){
        absenceRows.push({student:s, circle:getCircle(en.circleId), count});
      }
    });
  });
  absenceRows.sort((a,b)=>b.count-a.count);

  // 2) مقرئون لم يرفعوا الحصاد اليوم
  const noHarvestToday = DB.config.reciters.filter(r=>{
    const circles = circlesOfReciter(r.id);
    if(!circles.length) return false;
    return !DB.harvest.some(h=>h.reciterId===r.id && h.date===today);
  });

  // 3) مقرئون لم يسجلوا التحضير اليوم

function tplAchievements(){
  const circles = circlesOfReciter(session.reciterId);
  if(!circles.length) return `<div class="panel">${emptyState('لا توجد حلقة مرتبطة بك بعد','')}</div>`;

  // كل الفترات المتاحة عبر حلقات هذا المقرئ
  const periodIdsSet = new Set();
  circles.forEach(c=>(c.periodIds||[]).forEach(pid=>periodIdsSet.add(pid)));
  const availablePeriods = PRAYER_PERIODS.filter(p=>periodIdsSet.has(p.id));
  const selectedPeriodId = uiState.achievementPeriod || (availablePeriods[0]?availablePeriods[0].id:'');

  const rows = [];
  circles.forEach(c=>{
    studentsOfCircleAndPeriod(c.id, selectedPeriodId).forEach(s=>{
      const en = enrollmentOf(s, c.id) || {};
      const latest = latestAttendancePageFor(s.id, c.id);
      const page = latest ? latest.pageNumber : null;
      const pct = page ? Math.round((page/TOTAL_MUSHAF_PAGES)*100) : 0;
      rows.push({student:s, circle:c, qiraah:en.qiraah, page, pct});
    });
  });

  return `
  <div class="panel">
    <div class="panel-head"><h3>إنجاز الطلاب</h3><span class="count-badge">${rows.length}</span></div>
    ${availablePeriods.length ? `
    <div class="field" style="max-width:260px;">
      <label>الفترة</label>
      <select data-achievement-period>
        ${availablePeriods.map(p=>`<option value="${p.id}" ${selectedPeriodId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
    </div>` : ''}
    ${!rows.length ? emptyState('لا يوجد طلاب في هذه الفترة بعد','') : `
    <table><thead><tr><th>الطالب</th><th>الحلقة</th><th>القراءة</th><th>الصفحة الحالية</th><th>نسبة الإنجاز</th></tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td><b>${esc(r.student.name)}</b></td>
        <td class="small muted">${esc(circleLabel(r.circle))}</td>
        <td class="small muted">${esc(r.qiraah||'—')}</td>
        <td class="muted">${r.page?esc(r.page)+' / '+TOTAL_MUSHAF_PAGES:'—'}</td>
        <td style="min-width:160px;">
          <div class="flex items-center gap8">
            <div class="progress-track" style="flex:1;"><div class="progress-fill" style="width:${r.pct}%;background:${progressColor(r.pct)};"></div></div>
            <span class="small muted" style="width:38px;text-align:left;">${r.pct}%</span>
          </div>
        </td>
      </tr>`).join('')}
    </tbody></table>`}
  </div>`;
}

function tplMyCircles(){
  const circles = circlesOfReciter(session.reciterId);
  if(!circles.length) return `<div class="panel">${emptyState('لم يتم تعيينك بعد على أي حلقة','يرجى التواصل مع المشرف لإنشاء حلقة وربطها باسمك.')}</div>`;

  const byTrack = {};
  circles.forEach(c=>{ const t=c.track||CIRCLE_TRACKS[0]; (byTrack[t]=byTrack[t]||[]).push(c); });

  return CIRCLE_TRACKS.filter(t=>byTrack[t]&&byTrack[t].length).map(track=>`
    <div class="arch-divider"><span class="diamond"></span></div>
    <h3 style="margin:0 0 10px;color:var(--primary-dark);">مسار: ${esc(track)}</h3>
    ${byTrack[track].map(c=>renderMyCircleCard(c)).join('')}
  `).join('');
}

function renderMyCircleCard(c){
  const allStudents = studentsOfCircle(c.id);
  const periods = (c.periodIds||[]).map(pid=>getPeriod(pid)).filter(Boolean);
  const selectedPeriodId = (uiState.myCirclePeriod||{})[c.id] || (periods[0]?periods[0].id:'');
  const showPeriodFilter = periods.length > 1;
  const students = showPeriodFilter && selectedPeriodId
    ? allStudents.filter(s=>{ const en=enrollmentOf(s,c.id); return en && en.periodId===selectedPeriodId; })
    : allStudents;
  return `<div class="panel">
      <div class="panel-head"><h3>طلاب الحلقة — ${esc(circleLabel(c))}</h3><span class="count-badge">${students.length} طالب</span></div>
      <div class="hint" style="margin:0 0 12px;">الفترات: ${esc(circlePeriodsLabel(c))}</div>
      ${showPeriodFilter ? `
      <div class="field" style="max-width:260px;">
        <label>عرض طلاب فترة</label>
        <select data-my-circle-period="${c.id}">
          ${periods.map(p=>`<option value="${p.id}" ${selectedPeriodId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>` : ''}
      ${!students.length ? emptyState('لا يوجد طلاب في هذه الفترة/الحلقة بعد','يقوم المشرف بإضافة الطلاب لحلقتك.') : `
      <table><thead><tr><th>الاسم</th><th>رقم التسجيل</th><th>الجنسية</th><th>الفترة</th><th>أين وصل</th><th>القراءة</th><th>أيام الغياب</th></tr></thead><tbody>
        ${students.map(s=>{
          const en = enrollmentOf(s, c.id) || {};
          const pe = en.periodId ? getPeriod(en.periodId) : null;
          const abs = absenceDaysCount(s.id, c.id);
          const latestAtt = latestAttendancePageFor(s.id, c.id);
          const whereReached = latestAtt ? `صفحة ${latestAtt.pageNumber}${latestAtt.surah?' — '+latestAtt.surah:''}` : '—';
          return `<tr><td><b>${esc(s.name)}</b></td><td class="muted">${esc(s.regNumber||'—')}</td><td class="muted">${esc(s.nationality||'—')}</td><td class="muted">${esc(pe?.name||'—')}</td><td class="muted">${esc(whereReached)}</td><td class="muted">${esc(en.qiraah||'—')}</td><td>${abs>0?`<span class="tag tag-red">${abs}</span>`:'0'}</td></tr>`;
        }).join('')}
      </tbody></table>`}
    </div>`;
}

function selectorBar(){
  const circles = circlesOfReciter(session.reciterId);
  const f = uiState.sessCtx || {};
  const currentCircle = getCircle(f.circleId);
  const availablePeriods = currentCircle ? PRAYER_PERIODS.filter(p=>(currentCircle.periodIds||[]).includes(p.id)) : [];
  return `
  <div class="panel">
    <div class="filter-bar">
      <div class="field mb0"><label>الحلقة</label>
        <select data-ctx="circleId">${circles.map(c=>`<option value="${c.id}" ${f.circleId===c.id?'selected':''}>${esc(circleLabel(c))}</option>`).join('')}</select>
      </div>
      <div class="field mb0"><label>الفترة</label>
        ${availablePeriods.length ? `<select data-ctx="periodId">${availablePeriods.map(p=>`<option value="${p.id}" ${f.periodId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>` : `<div class="error-box small">لا توجد فترات محددة لهذه الحلقة، يرجى مطالبة المشرف بتحديدها.</div>`}
      </div>
      <div class="field mb0"><label>التاريخ</label>
        <input type="date" data-ctx="date" value="${f.date||todayStr()}">
      </div>
    </div>
  </div>`;
}

function ensureCtx(){
  const circles = circlesOfReciter(session.reciterId);
  if(!uiState.sessCtx) uiState.sessCtx = {};
  const prevCircleId = uiState.sessCtx.circleId;
  if(!uiState.sessCtx.circleId && circles.length) uiState.sessCtx.circleId = circles[0].id;
  const circle = getCircle(uiState.sessCtx.circleId);
  const availablePeriodIds = circle ? (circle.periodIds||[]) : [];
  // إن تغيّرت الحلقة أو كانت الفترة المختارة لا تنتمي لها، أعد الاختيار لأول فترة متاحة
  if(!uiState.sessCtx.periodId || !availablePeriodIds.includes(uiState.sessCtx.periodId) || prevCircleId!==uiState.sessCtx.circleId){
    uiState.sessCtx.periodId = availablePeriodIds[0] || '';
  }
  if(!uiState.sessCtx.date) uiState.sessCtx.date = todayStr();
}

function tplReciterPlans(){
  const circles = circlesOfReciter(session.reciterId);
  if(!circles.length) return `<div class="panel">${emptyState('لا توجد حلقة مرتبطة بك بعد','تواصل مع المشرف لإنشاء حلقتك.')}</div>`;
  ensureCtx();
  const ctx = uiState.sessCtx;
  const students = ctx.circleId ? studentsOfCircle(ctx.circleId) : [];
  const qiraahOptions = DB.config.qiraahOptions;
  const planTypes = DB.config.planTypes;

          const existing = DB.plans.find(p=>p.studentId===s.id && p.circleId===ctx.circleId && p.periodId===ctx.periodId && p.date===ctx.date);
          const en = enrollmentOf(s, ctx.circleId) || {};
          const defaultQiraah = existing?.qiraah || en.qiraah || '';
          return `<tr>
            <td><b>${esc(s.name)}</b></td>
            <td>
              <select name="qiraah_${s.id}">

              </select>
            </td>
            <td>
              <select name="plan_${s.id}">
                <option value="">— بدون —</option>
                ${planTypes.map(o=>`<option value="${esc(o)}" ${existing?.planType===o?'selected':''}>${esc(o)}</option>`).join('')}
              </select>
            </td>
          </tr>`;
        }).join('')}
      </tbody></table>
      <div style="margin-top:16px;"><button class="btn btn-primary" type="submit">حفظ الخطط لهذه الفترة</button></div>
    </form>`}
  </div>

  <div class="panel">
    <div class="panel-head"><h3>السجل اليومي — ${esc(isToday?'اليوم':ctx.date)}</h3><span class="count-badge">${dailyLog.length}</span></div>
    ${!dailyLog.length ? emptyState('لا توجد خطط مسجّلة بهذا التاريخ لهذه الحلقة بعد','') : `
    <table><thead><tr><th>الطالب</th><th>الفترة</th><th>القراءة</th><th>مقدار القراءة</th></tr></thead><tbody>
      ${dailyLog.map(p=>{
        const st = getStudent(p.studentId), pe = getPeriod(p.periodId);
        return `<tr><td><b>${esc(st?.name||'—')}</b></td><td class="muted small">${esc(pe?.name||'—')}</td><td class="small muted">${esc(p.qiraah||'—')}</td><td>${esc(p.planType||'—')}</td></tr>`;
      }).join('')}
    </tbody></table>`}
  </div>`;
}

    <form data-form="save-attendance">

        ${students.map(s=>{
          const existingAtt = DB.attendance.find(a=>a.studentId===s.id && a.circleId===ctx.circleId && a.periodId===ctx.periodId && a.date===ctx.date);
          const existingPlan = DB.plans.find(p=>p.studentId===s.id && p.circleId===ctx.circleId && p.periodId===ctx.periodId && p.date===ctx.date);
          const cur = existingAtt?.status || 'حاضر';
          const curCls = ATTENDANCE_STATUSES.find(st=>st.val===cur)?.cls || 'present';
          const curPage = existingAtt?.pageNumber ?? '';
          const curSurah = existingAtt?.surah || surahForPage(curPage);
          return `<tr>
            <td><b>${esc(s.name)}</b></td>
            <td class="small muted">${existingPlan ? `${esc(existingPlan.planType||'')}${existingPlan.qiraah?' — '+esc(existingPlan.qiraah):''}` : `<span class="tag tag-neutral">لا توجد خطة</span>`}</td>
            <td>
              <input type="hidden" name="status_${s.id}" value="${esc(cur)}">
              <div class="status-picker" data-status-group="${s.id}">
                ${ATTENDANCE_STATUSES.map(st=>`<button type="button" data-status-btn="${s.id}" data-val="${esc(st.val)}" class="sel-${st.cls} ${curCls===st.cls?'active':''}">${esc(st.val)}</button>`).join('')}
              </div>
            </td>
            <td>
              <input type="number" min="1" max="604" name="page_${s.id}" data-page-input="${s.id}" value="${esc(curPage)}" placeholder="رقم الصفحة" style="width:110px;">
              <div class="small muted" data-surah-label="${s.id}" style="margin-top:4px;">${esc(curSurah)}</div>
            </td>
            <td><input type="text" name="note_${s.id}" value="${esc(existingAtt?.note||'')}" placeholder="ملاحظات اختيارية"></td>
          </tr>`;
        }).join('')}
      </tbody></table>
      <div class="hint" style="margin-top:10px;">عند اختيار "حاضر" أو "حضر ولم يقرئ" سيُحتسب الطالب ضمن الحصاد تلقائيًا عند الحفظ، دون الحاجة لرفع حصاد منفصل.</div>
      <div style="margin-top:10px;"><button class="btn btn-primary" type="submit">حفظ التحضير</button></div>
    </form>`}
  </div>`;
}

function tplReciterHarvest(){
  const circles = circlesOfReciter(session.reciterId);
  if(!circles.length) return `<div class="panel">${emptyState('لا توجد حلقة مرتبطة بك بعد','تواصل مع المشرف لإنشاء حلقتك.')}</div>`;
  ensureCtx();
  const ctx = uiState.sessCtx;
  const existing = DB.harvest.find(h=>h.reciterId===session.reciterId && h.circleId===ctx.circleId && h.periodId===ctx.periodId && h.date===ctx.date);
  const myHarvests = DB.harvest.filter(h=>h.reciterId===session.reciterId).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8);

  return selectorBar() + `
  <div class="panel">
    <div class="panel-head"><h3>حصاد الفترة — ${esc(ctx.date===todayStr()?'اليوم':ctx.date)}</h3></div>
    <div class="hint" style="margin:0 0 14px;">يُحتسب عدد الحاضرين والملخص تلقائيًا من صفحة "التحضير" عند حفظها — لا حاجة لإدخالهما هنا يدويًا.</div>
    ${!existing ? emptyState('لم يُسجَّل حصاد لهذه الفترة بعد','سجّل التحضير أولاً من تبويب "التحضير" وسيظهر الحصاد هنا تلقائيًا.') : `
    <div class="grid g-2" style="margin-bottom:14px;">
      <div class="stat-card"><div class="num">${existing.presentCount ?? 0} / ${studentsOfCircle(ctx.circleId).length}</div><div class="lbl">عدد الحاضرين (تلقائي)</div></div>
      <div class="stat-card"><div class="num small" style="font-size:14px;line-height:1.6;">${esc(existing.summary||'—')}</div><div class="lbl">ملخص الحاضرين (تلقائي)</div></div>
    </div>
    <form data-form="save-harvest">
      <div class="field"><label>عدد الصفحات / الأجزاء المنجزة (اختياري)</label><input type="text" name="amount" value="${esc(existing?.amount||'')}" placeholder="مثال: 3 أجزاء ونصف"></div>
      <div class="field"><label>ملاحظات إضافية للمشرف (اختياري)</label>
        <textarea name="note" placeholder="أي ملاحظات أخرى">${esc(existing?.note||'')}</textarea>
      </div>
      <button class="btn btn-primary" type="submit">حفظ الملاحظات</button>
    </form>`}
  </div>

  <div class="panel">
    <div class="panel-head"><h3>سجل الحصاد الأخير</h3></div>
    ${!myHarvests.length ? emptyState('لا يوجد سجل حصاد بعد','') : `
    <table><thead><tr><th>الحلقة</th><th>الفترة</th><th>إجمالي الحضور</th><th>الملخص</th><th>التاريخ</th></tr></thead><tbody>
      ${myHarvests.map(h=>{
        const c=getCircle(h.circleId), pe=getPeriod(h.periodId);
        const total = h.circleId ? studentsOfCircle(h.circleId).length : 0;
        return `<tr><td>${esc(c?circleLabel(c):'—')}</td><td>${esc(pe?.name||'—')}</td><td><b>${h.presentCount??0}</b> من ${total}</td><td class="small">${esc((h.summary||'').slice(0,50))}${(h.summary||'').length>50?'…':''}</td><td class="muted small">${esc(h.date)}</td></tr>`;
      }).join('')}
    </tbody></table>`}
  </div>`;
}

/* ======================= EVENT BINDING ======================= */
function pendingConfirm(key, actuallyDo){
  if(uiState.confirmId===key){
    uiState.confirmId=null;
    actuallyDo();
  }else{
    uiState.confirmId=key;
    render();
    setTimeout(()=>{ if(uiState.confirmId===key){ uiState.confirmId=null; render(); } }, 3000);
  }
}

function bindContentEvents(){
  const content = document.getElementById('content');
  if(!content) return;

  content.addEventListener('click', async (e)=>{
    const btn = e.target.closest('[data-action]');
    if(btn){
      const action = btn.dataset.action;

      if(action==='del-reciter'){
        const id = btn.dataset.id;
        pendingConfirm('reciter:'+id, async ()=>{
          DB.config.reciters = DB.config.reciters.filter(r=>r.id!==id);
          const circleIds = DB.config.circles.filter(c=>c.reciterId===id).map(c=>c.id);
          DB.config.circles = DB.config.circles.filter(c=>c.reciterId!==id);
          DB.config.students.forEach(s=>{ s.enrollments = (s.enrollments||[]).filter(en=>!circleIds.includes(en.circleId)); });
          await saveConfig(); showToast('تم حذف المقرئ'); render();
        });
      }
      if(action==='del-all-reciters'){
        pendingConfirm('all-reciters', async ()=>{
          DB.config.reciters = [];
          DB.config.circles = [];
          DB.config.students.forEach(s=>{ s.enrollments = []; });
          await saveConfig(); showToast('تم حذف جميع المقرئين (وما يتبعها من حلقات وتسجيلات الطلاب)'); render();
        });
      }
      if(action==='del-circle'){
        const id = btn.dataset.id;
        pendingConfirm('circle:'+id, async ()=>{
          DB.config.circles = DB.config.circles.filter(c=>c.id!==id);
          DB.config.students.forEach(s=>{ s.enrollments = (s.enrollments||[]).filter(en=>en.circleId!==id); });
          await saveConfig(); showToast('تم حذف الحلقة'); render();
        });
      }
      if(action==='del-all-circles'){
        pendingConfirm('all-circles', async ()=>{
          DB.config.circles = [];
          DB.config.students.forEach(s=>{ s.enrollments = []; });
          await saveConfig(); showToast('تم حذف جميع الحلقات'); render();
        });
      }
      if(action==='del-all-students'){
        pendingConfirm('all-students', async ()=>{
          DB.config.students = [];
          await saveConfig(); showToast('تم حذف جميع الطلاب'); render();
        });
      }
      if(action==='unset-khatma'){
        const s = getStudent(btn.dataset.id);
        if(s){ s.khatmaDate = null; s.khatmaCircleId = null; await saveConfig(); showToast('تمت إزالة الطالب من قائمة الخاتمين'); render(); }
      }
      if(action==='del-plan-record'){
        const id = btn.dataset.id;
        pendingConfirm('planrec:'+id, async ()=>{
          DB.plans = DB.plans.filter(p=>p.id!==id);
          await savePlans(); showToast('تم حذف الخطة'); render();
        });
      }
      if(action==='del-attendance-record'){
        const id = btn.dataset.id;
        pendingConfirm('attrec:'+id, async ()=>{
          DB.attendance = DB.attendance.filter(a=>a.id!==id);
          await saveAttendance(); showToast('تم حذف التحضير'); render();
        });
      }
      if(action==='del-harvest-record'){
        const id = btn.dataset.id;
        pendingConfirm('harvrec:'+id, async ()=>{
          DB.harvest = DB.harvest.filter(h=>h.id!==id);
          await saveHarvest(); showToast('تم حذف الحصاد'); render();
        });
      }
      if(action==='del-examination'){
        const id = btn.dataset.id;
        pendingConfirm('exam:'+id, async ()=>{
          DB.examinations = DB.examinations.filter(x=>x.id!==id);
          await saveExaminations(); showToast('تم حذف النتيجة'); render();
        });
      }
      if(action==='circle-track-tab'){
        uiState.circleTrackTab = btn.dataset.track; render();
      }
      if(action==='del-student'){
        const id = btn.dataset.id;
        pendingConfirm('student:'+id, async ()=>{
          DB.config.students = DB.config.students.filter(s=>s.id!==id);
          await saveConfig(); showToast('تم حذف الطالب'); render();
        });
      }
      if(action==='toggle-student'){
        const id = btn.dataset.id;
        uiState.expandedStudent = uiState.expandedStudent===id ? null : id;
        uiState.enrollingStudent = null;
        uiState.editingStudentInfo = null;
        render();
      }
      if(action==='start-edit-student-info'){
        uiState.editingStudentInfo = btn.dataset.id; render();
      }
      if(action==='cancel-edit-student-info'){
        uiState.editingStudentInfo = null; render();
      }
      if(action==='start-enroll'){
        uiState.enrollingStudent = btn.dataset.id; render();
      }
      if(action==='cancel-enroll'){
        uiState.enrollingStudent = null; render();
      }
      if(action==='del-enrollment'){
        const sid = btn.dataset.sid, cid = btn.dataset.cid;
        const s = getStudent(sid);
        if(s){
          s.enrollments = (s.enrollments||[]).filter(en=>en.circleId!==cid);
          await saveConfig(); showToast('تمت إزالة الطالب من الحلقة'); render();
        }
      }
      if(action==='reset-reciter-pw'){
        uiState.resettingReciter = btn.dataset.id; render();
      }
      if(action==='toggle-examiner'){
        const r = DB.config.reciters.find(x=>x.id===btn.dataset.id);
        if(r){ r.isExaminer = !r.isExaminer; await saveConfig(); showToast(r.isExaminer?'تم منح صلاحية المختبر':'تم إلغاء صلاحية المختبر'); render(); }
      }
      if(action==='cancel-reset-reciter'){
        uiState.resettingReciter = null; render();
      }
      if(action==='del-supervisor'){
        const id = btn.dataset.id;
        if(DB.config.supervisors.length<=1) return;
        pendingConfirm('sup:'+id, async ()=>{
          DB.config.supervisors = DB.config.supervisors.filter(s=>s.id!==id);
          await saveConfig(); showToast('تم حذف الحساب'); render();
        });
      }
      if(action==='del-qiraah'){
        const idx = parseInt(btn.dataset.idx,10);
        pendingConfirm('qr:'+idx, async ()=>{
          DB.config.qiraahOptions.splice(idx,1);
          await saveConfig(); showToast('تم حذف القراءة'); render();
        });
      }
      if(action==='del-plan-type'){
        const idx = parseInt(btn.dataset.idx,10);
        pendingConfirm('pt:'+idx, async ()=>{
          DB.config.planTypes.splice(idx,1);
          await saveConfig(); showToast('تم حذف مقدار القراءة'); render();
        });
      }
      if(action==='download-template'){
        try{
          const wb = buildTemplateWorkbook();
          XLSX.writeFile(wb, 'نموذج_استيراد_شعبة_الإجازات.xlsx');
        }catch(err){ showToast('تعذر إنشاء النموذج'); }
      }
      if(action==='run-import'){
        if(!uiState.importFileObj || uiState.importing) return;
        uiState.importing = true; render();
        try{
          const result = await processImportFile(uiState.importFileObj);
          uiState.importResult = result;
          if(result.saved===false){
            uiState.importResult.errors = ['⚠️ تم استخراج البيانات من الملف بنجاح، لكن الحفظ في قاعدة البيانات فشل — قد تختفي هذه البيانات عند تحديث الصفحة. تحقق من الاتصال بقاعدة البيانات (وتأكد أن Apps Script محدَّث لآخر نسخة) ثم أعد الاستيراد.', ...uiState.importResult.errors];
          }else{
            showToast('اكتمل الاستيراد وحُفظ بنجاح: '+(result.reciters+result.circles+result.students)+' سجل');
          }
        }catch(err){
          uiState.importResult = {reciters:0, circles:0, students:0, errors:['تعذّرت قراءة الملف. تأكد أنه بصيغة xlsx صحيحة.'], saved:true};
        }
        uiState.importing = false;
        uiState.importFileObj = null;
        render();
      }
      if(action==='retry-import-save'){
        const ok = await saveConfig();
        if(uiState.importResult) uiState.importResult.saved = ok;
        showToast(ok ? 'تم الحفظ بنجاح الآن' : 'ما زال الحفظ يفشل — تحقق من الاتصال بقاعدة البيانات');
        render();
      }
      if(action==='track-sub'){
        uiState.trackSub = btn.dataset.sub; render();
      }
      if(action==='print-khatmeen'){
        const circles = circlesOfReciter(session.reciterId);
        const circleIds = circles.map(c=>c.id);
        const khatmeen = DB.config.students.filter(s=> s.khatmaDate && (s.enrollments||[]).some(en=>circleIds.includes(en.circleId)));
        khatmeen.sort((a,b)=> (b.khatmaDate||'').localeCompare(a.khatmaDate||''));
        printKhatmeenList(khatmeen);
      }
      return;
    }

    const statusBtn = e.target.closest('[data-status-btn]');
    if(statusBtn){
      const sid = statusBtn.dataset.statusBtn;
      const val = statusBtn.dataset.val;
      const group = content.querySelector(`[data-status-group="${sid}"]`);
      group.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      statusBtn.classList.add('active');
      const hidden = content.querySelector(`input[name="status_${sid}"]`);
      if(hidden) hidden.value = val;
    }
  });

  content.addEventListener('change', (e)=>{
    const filt = e.target.closest('[data-filter]');
    if(filt){
      if(filt.dataset.filter==='circlePeriod'){
        uiState.circlePeriodFilter = filt.value; render(); return;
      }
      if(filt.dataset.filter==='examReciterId'){
        uiState.examFilter = uiState.examFilter || {}; uiState.examFilter.reciterId = filt.value; render(); return;
      }
      if(filt.dataset.filter==='examTrack'){
        uiState.examFilter = uiState.examFilter || {}; uiState.examFilter.track = filt.value; render(); return;
      }
      if(filt.dataset.filter==='examPassed'){
        uiState.examFilter = uiState.examFilter || {}; uiState.examFilter.passed = filt.value; render(); return;
      }
      if(filt.dataset.filter==='examDate'){
        uiState.examFilter = uiState.examFilter || {}; uiState.examFilter.date = filt.value; render(); return;
      }
      uiState.trackFilter = uiState.trackFilter || {};
      uiState.trackFilter[filt.dataset.filter] = filt.value;
      render(); return;
    }
    const ctx = e.target.closest('[data-ctx]');
    if(ctx){
      uiState.sessCtx = uiState.sessCtx || {};
      uiState.sessCtx[ctx.dataset.ctx] = ctx.value;
      render(); return;
    }
    const myCirclePeriod = e.target.closest('[data-my-circle-period]');
    if(myCirclePeriod){
      uiState.myCirclePeriod = uiState.myCirclePeriod || {};
      uiState.myCirclePeriod[myCirclePeriod.dataset.myCirclePeriod] = myCirclePeriod.value;
      render(); return;
    }
    const achPeriod = e.target.closest('[data-achievement-period]');
    if(achPeriod){
      uiState.achievementPeriod = achPeriod.value;
      render(); return;
    }
    const importFile = e.target.closest('[data-import-file]');
    if(importFile){
      uiState.importFileObj = importFile.files && importFile.files[0] ? importFile.files[0] : null;
      render(); return;
    }
  });

  content.addEventListener('input', (e)=>{
    const pageInput = e.target.closest('[data-page-input]');
    if(pageInput){
      const sid = pageInput.dataset.pageInput;
      const label = content.querySelector(`[data-surah-label="${sid}"]`);
      if(label) label.textContent = surahForPage(pageInput.value);
      return;
    }
    const searchInput = e.target.closest('#studentSearchInput');
    if(searchInput){
      uiState.studentSearch = searchInput.value;
      const cursorPos = searchInput.selectionStart;
      render();
      const newInput = document.getElementById('studentSearchInput');
      if(newInput){ newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
      return;
    }
    const khatmaSearchInput = e.target.closest('#khatmaAddSearchInput');
    if(khatmaSearchInput){
      uiState.khatmaAddSearch = khatmaSearchInput.value;
      const cursorPos = khatmaSearchInput.selectionStart;
      render();
      const newInput = document.getElementById('khatmaAddSearchInput');
      if(newInput){ newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
      return;
    }
    const circleSearchInput = e.target.closest('#circleSearchInput');
    if(circleSearchInput){
      uiState.circleSearch = circleSearchInput.value;
      const cursorPos = circleSearchInput.selectionStart;
      render();
      const newInput = document.getElementById('circleSearchInput');
      if(newInput){ newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
    }
  });

  content.addEventListener('submit', async (e)=>{
    const form = e.target.closest('form[data-form]');
    if(!form) return;
    e.preventDefault();
    const type = form.dataset.form;
    const fd = new FormData(form);

    if(type==='add-reciter'){
      const name = (fd.get('name')||'').toString().trim();
      const username = (fd.get('username')||'').toString().trim();
      const email = (fd.get('email')||'').toString().trim();
      const password = (fd.get('password')||'').toString();
      addReciterError = '';
      if(!name||!username||!email||!password){ addReciterError='يرجى تعبئة جميع الحقول'; render(); return; }
      if(DB.config.reciters.some(r=>r.username===username)){ addReciterError='اسم المستخدم هذا مستخدم بالفعل، اختر قيمة أخرى'; render(); return; }
      if(DB.config.reciters.some(r=>r.email===email)){ addReciterError='هذا البريد الإلكتروني مستخدم بالفعل، اختر بريدًا آخر'; render(); return; }
      const passwordHash = await hashPassword(password);
      DB.config.reciters.push({id:uid(), name, username, email, passwordHash});
      await saveConfig(); showToast('تمت إضافة المقرئ'); render();
    }
    if(type==='reset-reciter-pw'){
      const id = fd.get('id');
      const password = (fd.get('password')||'').toString();
      if(!password) return;
      const r = DB.config.reciters.find(x=>x.id===id);
      if(r){ r.passwordHash = await hashPassword(password); await saveConfig(); showToast('تم تحديث كلمة المرور'); }
      uiState.resettingReciter = null; render();
    }
    if(type==='add-examination'){
      const studentName=(fd.get('studentName')||'').toString().trim();
      const nationality=(fd.get('nationality')||'').toString().trim();
      const passed=fd.get('passed')==='1';
      const passPercentageRaw=fd.get('passPercentage');
      const track=(fd.get('track')||CIRCLE_TRACKS[0]).toString();
      const recommendation=(fd.get('recommendation')||EXAM_RECOMMENDATIONS[0]).toString();
      const notes=(fd.get('notes')||'').toString().trim();
      if(!studentName) return;
      DB.examinations.push({
        id:uid(), studentName, nationality, passed,
        passPercentage: passPercentageRaw? parseInt(passPercentageRaw,10): null,
        track, recommendation, notes, examinerReciterId:session.reciterId, date:todayStr()
      });
      await saveExaminations(); showToast('تم حفظ نتيجة الاختبار'); render();
    }
    if(type==='change-own-password'){
      const currentPassword = (fd.get('currentPassword')||'').toString();
      const newPassword = (fd.get('newPassword')||'').toString();
      const confirmPassword = (fd.get('confirmPassword')||'').toString();
      changePasswordError = ''; changePasswordSuccess = false;
      const account = session.role==='supervisor' ? getSupervisor(session.id) : getReciter(session.reciterId);
      if(!account){ changePasswordError='تعذّر إيجاد الحساب'; render(); return; }
      const ok = await verifyPassword(currentPassword, account.passwordHash);
      if(!ok){ changePasswordError='كلمة المرور الحالية غير صحيحة'; render(); return; }
      if(newPassword.length<4){ changePasswordError='كلمة المرور الجديدة قصيرة جدًا'; render(); return; }
      if(newPassword!==confirmPassword){ changePasswordError='كلمتا المرور الجديدتان غير متطابقتين'; render(); return; }
      account.passwordHash = await hashPassword(newPassword);
      await saveConfig();
      changePasswordSuccess = true;
      render();
    }
    if(type==='add-supervisor'){
      const name=(fd.get('name')||'').toString().trim();
      const username=(fd.get('username')||'').toString().trim();
      const password=(fd.get('password')||'').toString();
      addSupervisorError='';
      if(!name||!username||!password){ addSupervisorError='يرجى تعبئة جميع الحقول'; render(); return; }
      if(DB.config.supervisors.some(s=>s.username===username)){ addSupervisorError='هذا البريد الإلكتروني/اسم المستخدم مستخدم بالفعل، اختر قيمة أخرى'; render(); return; }
      const passwordHash = await hashPassword(password);
      DB.config.supervisors.push({id:uid(), name, username, passwordHash});
      await saveConfig(); showToast('تمت إضافة حساب المشرف'); render();
    }
    if(type==='add-circle'){
      const name=(fd.get('name')||'').toString().trim();
      const number=(fd.get('number')||'').toString().trim();
      const reciterId=fd.get('reciterId');
      const track=(fd.get('track')||CIRCLE_TRACKS[0]).toString();
      const periodIds = fd.getAll('periodIds');
      if(!name||!reciterId||!number) return;
      DB.config.circles.push({id:uid(), name, number, reciterId, track, periodIds});
      await saveConfig(); showToast('تم إنشاء الحلقة'); render();
    }
    if(type==='add-student'){
      const name=(fd.get('name')||'').toString().trim();
      const circleId=(fd.get('circleId')||'').toString().trim();
      const regNumber=(fd.get('regNumber')||'').toString().trim();
      const nationality=(fd.get('nationality')||'').toString().trim();
      const level=(fd.get('level')||'').toString().trim();
      const progress=(fd.get('progress')||'').toString().trim();
      const qiraah=(fd.get('qiraah')||'').toString().trim();
      const periodId=(fd.get('periodId')||'').toString().trim();
      if(!name) return;
      const enrollments = circleId ? [{circleId, level, progress, qiraah, periodId}] : [];
      DB.config.students.push({id:uid(), name, regNumber, nationality, enrollments});
      await saveConfig(); showToast('تمت إضافة الطالب'); render();
    }
    if(type==='edit-student-info'){
      const studentId=fd.get('studentId');
      const regNumber=(fd.get('regNumber')||'').toString().trim();
      const nationality=(fd.get('nationality')||'').toString().trim();
      const khatmaDate=(fd.get('khatmaDate')||'').toString().trim();
      const s = getStudent(studentId);
      if(s){ s.regNumber=regNumber; s.nationality=nationality; s.khatmaDate=khatmaDate||null; await saveConfig(); showToast('تم تحديث بيانات الطالب'); }
      uiState.editingStudentInfo = null; render();
    }
    if(type==='set-khatma'){
      const studentId=fd.get('studentId');
      const khatmaDate=(fd.get('khatmaDate')||'').toString().trim();
      const s = getStudent(studentId);
      if(s && khatmaDate){ s.khatmaDate = khatmaDate; await saveConfig(); showToast('تم تسجيل الطالب كخاتم'); }
      uiState.khatmaAddSearch = ''; render();
    }
    if(type==='add-enrollment'){
      const studentId=fd.get('studentId');
      const circleId=fd.get('circleId');
      const level=(fd.get('level')||'').toString().trim();
      const progress=(fd.get('progress')||'').toString().trim();
      const qiraah=(fd.get('qiraah')||'').toString().trim();
      const periodId=(fd.get('periodId')||'').toString().trim();
      if(!studentId||!circleId) return;
      const s = getStudent(studentId);
      if(s){
        s.enrollments = s.enrollments||[];
        if(!s.enrollments.some(en=>en.circleId===circleId)) s.enrollments.push({circleId, level, progress, qiraah, periodId});
        await saveConfig(); showToast('تمت إضافة الطالب للحلقة'); 
      }
      uiState.enrollingStudent = null; render();
    }
    if(type==='add-qiraah'){
      const text=(fd.get('text')||'').toString().trim();
      if(!text) return;
      DB.config.qiraahOptions.push(text);
      await saveConfig(); showToast('تمت الإضافة'); render();
    }
    if(type==='add-plan-type'){
      const text=(fd.get('text')||'').toString().trim();
      if(!text || DB.config.planTypes.includes(text)) return;
      DB.config.planTypes.push(text);
      await saveConfig(); showToast('تمت الإضافة'); render();
    }
    if(type==='save-plans'){
      const ctx = uiState.sessCtx;
      const students = studentsOfCircle(ctx.circleId);
      let count=0;
      students.forEach(s=>{
        const qiraah = fd.get('qiraah_'+s.id) || '';
        const planType = fd.get('plan_'+s.id);
        const idx = DB.plans.findIndex(p=>p.studentId===s.id && p.circleId===ctx.circleId && p.periodId===ctx.periodId && p.date===ctx.date);
        if(!planType){
          if(idx>-1) DB.plans.splice(idx,1);
          return;
        }
        count++;
        const rec = {id: idx>-1?DB.plans[idx].id:uid(), studentId:s.id, circleId:ctx.circleId, periodId:ctx.periodId, date:ctx.date, qiraah, planType, setBy:session.name};
        if(idx>-1) DB.plans[idx]=rec; else DB.plans.push(rec);
      });
      await savePlans();
      showToast('تم حفظ الخطط ('+count+')'); render();
    }
    if(type==='save-attendance'){
      const ctx = uiState.sessCtx;
      const students = studentsOfCircleAndPeriod(ctx.circleId, ctx.periodId);
      const presentEntries = []; // لتوليد ملخص الحصاد تلقائيًا
      let newlyCompleted = 0;
      students.forEach(s=>{
        const status = fd.get('status_'+s.id) || 'حاضر';
        const note = fd.get('note_'+s.id) || '';
        const pageRaw = fd.get('page_'+s.id);
        const pageNumber = pageRaw? parseInt(pageRaw,10): null;
        const surah = pageNumber? surahForPage(pageNumber): '';
        const idx = DB.attendance.findIndex(a=>a.studentId===s.id && a.circleId===ctx.circleId && a.periodId===ctx.periodId && a.date===ctx.date);
        const rec = {id: idx>-1?DB.attendance[idx].id:uid(), studentId:s.id, circleId:ctx.circleId, periodId:ctx.periodId, date:ctx.date, status, note, pageNumber, surah, recordedBy:session.name};
        if(idx>-1) DB.attendance[idx]=rec; else DB.attendance.push(rec);
        if(PRESENT_STATUSES.includes(status)){
          presentEntries.push(`${s.name}${pageNumber?` (صفحة ${pageNumber}${surah?' — '+surah:''})`:''}`);
        }
        // وضع تلقائي في قائمة الخاتمين عند الوصول لآخر صفحة في المصحف (من التحضير اليومي)
        if(pageNumber===TOTAL_MUSHAF_PAGES && !s.khatmaDate){
          s.khatmaDate = ctx.date; s.khatmaCircleId = ctx.circleId; newlyCompleted++;
        }
      });
      await saveAttendance();
      if(newlyCompleted>0) await saveConfig();

      // توليد/تحديث سجل الحصاد تلقائيًا من نتائج التحضير — دون الحاجة لرفع منفصل
      const hIdx = DB.harvest.findIndex(h=>h.reciterId===session.reciterId && h.circleId===ctx.circleId && h.periodId===ctx.periodId && h.date===ctx.date);
      const hRec = {
        id: hIdx>-1?DB.harvest[hIdx].id:uid(),
        reciterId: session.reciterId, circleId: ctx.circleId, periodId: ctx.periodId, date: ctx.date,
        presentCount: presentEntries.length,
        amount: hIdx>-1?(DB.harvest[hIdx].amount||''):'',
        summary: presentEntries.length? ('الحاضرون: '+presentEntries.join('، ')) : '',
        note: hIdx>-1?(DB.harvest[hIdx].note||''):'',
        autoGenerated: true
      };
      if(hIdx>-1) DB.harvest[hIdx]=hRec; else DB.harvest.push(hRec);
      await saveHarvest();

      showToast('تم حفظ التحضير، وتحديث الحصاد تلقائيًا' + (newlyCompleted?` — 🎉 ${newlyCompleted} طالب أتم الختمة`:'')); render();
    }
    if(type==='save-harvest'){
      const ctx = uiState.sessCtx;
      const amount = fd.get('amount');
      const note = fd.get('note');
      const idx = DB.harvest.findIndex(h=>h.reciterId===session.reciterId && h.circleId===ctx.circleId && h.periodId===ctx.periodId && h.date===ctx.date);
      const rec = {
        id: idx>-1?DB.harvest[idx].id:uid(),
        reciterId: session.reciterId, circleId: ctx.circleId, periodId: ctx.periodId, date: ctx.date,
        presentCount: idx>-1?DB.harvest[idx].presentCount:0,
        amount: amount||'', summary: idx>-1?DB.harvest[idx].summary:'', note: note||''
      };
      if(idx>-1) DB.harvest[idx]=rec; else DB.harvest.push(rec);
      await saveHarvest(); showToast('تم حفظ الملاحظات'); render();
    }
  });
}

init();
</script>

</html>
