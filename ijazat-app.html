<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شعبة إجازات القرآن الكريم — المسجد النبوي</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap');

:root{
  --bg:#F6F1E4;
  --surface:#FFFFFF;
  --surface-2:#FBF8EF;
  --ink:#20281F;
  --ink-soft:#5B6459;
  --primary:#1F4741;
  --primary-light:#2E6259;
  --primary-dark:#12302B;
  --gold:#AE8A3B;
  --gold-light:#E7D9AE;
  --maroon:#7C2E2E;
  --maroon-light:#F3E2E0;
  --ok:#2E6259;
  --ok-light:#E1EBE4;
  --warn:#8A6C1F;
  --warn-light:#F3E9CF;
  --border:#E4D9BC;
  --shadow: 0 8px 24px -12px rgba(18,48,43,0.25);
  --radius: 14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 100% -10%, #EFE4C1 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Amiri',serif;
}
button{font-family:inherit;}
::selection{background:var(--gold-light);}

/* ---------- geometric arch divider ---------- */
.arch-divider{
  display:flex; align-items:center; gap:8px; margin:18px 0;
  color:var(--gold);
}
.arch-divider::before,.arch-divider::after{
  content:''; flex:1; height:1px; background:linear-gradient(to var(--dir,left), var(--border), transparent);
}
.arch-divider .diamond{
  width:7px;height:7px; transform:rotate(45deg);
  border:1.5px solid var(--gold); background:var(--surface);
}

/* ---------- splash ---------- */
.splash{
  height:100vh; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:14px; color:var(--primary);
}
.spinner{
  width:34px;height:34px;border-radius:50%;
  border:3px solid var(--gold-light); border-top-color:var(--gold);
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- login ---------- */
.login-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-card{
  width:100%; max-width:460px; background:var(--surface);
  border:1px solid var(--border); border-radius:22px 22px 6px 6px;
  box-shadow:var(--shadow); overflow:hidden;
}
.login-head{
  background:
    linear-gradient(180deg, var(--primary-dark), var(--primary) 70%);
  padding:34px 28px 60px; text-align:center; position:relative; color:#fff;
}
.login-head svg{position:absolute; bottom:-1px; right:0; width:100%; height:40px;}
.login-head .eyebrow{
  letter-spacing:.14em; font-size:11px; color:var(--gold-light); text-transform:uppercase;
}
.login-head h1{
  margin:10px 0 4px; font-size:26px; font-weight:700;
}
.login-head p{margin:0; font-size:13px; color:#D9E4DD;}
.login-body{padding:22px 28px 30px;}
.role-toggle{
  display:flex; gap:8px; background:var(--surface-2); padding:5px; border-radius:12px; margin-bottom:20px;
  border:1px solid var(--border);
}
.role-toggle button{
  flex:1; border:none; background:transparent; padding:10px 8px; border-radius:9px;
  font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer; transition:.15s;
}
.role-toggle button.active{background:var(--primary); color:#fff;}
label{display:block; font-size:12.5px; color:var(--ink-soft); margin:0 0 6px; font-weight:500;}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:10px;
  font-family:inherit; font-size:14.5px; background:var(--surface); color:var(--ink);
  outline:none; transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(46,98,89,0.12);}
.field{margin-bottom:14px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; border-radius:10px; padding:11px 18px; font-size:14.5px; font-weight:700;
  cursor:pointer; transition:.15s; font-family:inherit;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-light);}
.btn-gold{background:var(--gold); color:#fff;}
.btn-gold:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent; color:var(--primary); border:1.5px solid var(--border);}
.btn-ghost:hover{border-color:var(--primary-light);}
.btn-danger{background:var(--maroon-light); color:var(--maroon);}
.btn-danger:hover{background:#ecd2d0;}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
.hint{font-size:12px; color:var(--ink-soft); margin-top:16px; text-align:center; line-height:1.7;}
.error-box{background:var(--maroon-light); color:var(--maroon); padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:14px;}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:250px; flex:none; background:linear-gradient(180deg,var(--primary-dark),var(--primary));
  color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.sidebar-head{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,0.12);}
.sidebar-head .eyebrow{font-size:10px; letter-spacing:.12em; color:var(--gold-light); text-transform:uppercase;}
.sidebar-head h2{font-size:18px; margin:6px 0 2px; font-weight:700;}
.sidebar-head p{font-size:12px; margin:0; color:#CBDAD2;}
.who{padding:14px 20px; border-bottom:1px solid rgba(255,255,255,0.12); font-size:12.5px; color:#D9E4DD;}
.who b{display:block; color:#fff; font-size:14px; font-family:'Amiri',serif;}
.nav{padding:14px 12px; flex:1; overflow-y:auto;}
.nav button{
  width:100%; text-align:right; background:transparent; border:none; color:#D9E4DD;
  padding:11px 14px; border-radius:10px; font-size:14px; cursor:pointer; margin-bottom:4px;
  display:flex; align-items:center; gap:10px; font-family:inherit; transition:.15s;
}
.nav button:hover{background:rgba(255,255,255,0.08); color:#fff;}
.nav button.active{background:var(--gold); color:#fff; font-weight:700;}
.nav .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7;flex:none;}
.sidebar-foot{padding:14px 16px 20px;}
.logout-btn{
  width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
  color:#fff; padding:10px; border-radius:10px; cursor:pointer; font-family:inherit; font-size:13px;
}
.logout-btn:hover{background:rgba(255,255,255,0.16);}

.main{flex:1; min-width:0;}
.topbar{
  background:var(--surface); border-bottom:1px solid var(--border); padding:20px 32px;
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.topbar h1{font-size:22px; margin:0; color:var(--primary-dark);}
.topbar .sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.content{padding:26px 32px 60px;}

/* ---------- cards / stats ---------- */
.grid{display:grid; gap:16px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.g-4{grid-template-columns:repeat(2,1fr);} .g-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g-4,.g-3,.g-2{grid-template-columns:1fr;}}

.stat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 20px;
  position:relative; overflow:hidden;
}
.stat-card::before{
  content:''; position:absolute; inset-inline-end:-18px; top:-18px; width:70px; height:70px;
  border:10px solid var(--gold-light); border-radius:50%; opacity:.5;
}
.stat-card .num{font-family:'Amiri',serif; font-size:32px; color:var(--primary-dark); font-weight:700;}
.stat-card .lbl{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px 24px; margin-bottom:20px;
}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.panel-head h3{margin:0; font-size:17px; color:var(--primary-dark);}
.panel-head .count-badge{
  background:var(--gold-light); color:var(--gold); font-size:11.5px; font-weight:700;
  padding:2px 9px; border-radius:20px; margin-inline-start:8px;
}

.form-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; align-items:end;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{
  text-align:right; color:var(--ink-soft); font-weight:700; font-size:11.5px; letter-spacing:.03em;
  text-transform:uppercase; padding:10px 12px; border-bottom:2px solid var(--border);
}
tbody td{padding:12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.empty-state{
  text-align:center; padding:34px 20px; color:var(--ink-soft);
}
.empty-state .glyph{font-size:26px; margin-bottom:8px; color:var(--gold);}
.empty-state b{display:block; color:var(--ink); margin-bottom:4px; font-size:14.5px;}

.tag{
  display:inline-flex; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700;
}
.tag-green{background:var(--ok-light); color:var(--ok);}
.tag-gold{background:var(--warn-light); color:var(--warn);}
.tag-red{background:var(--maroon-light); color:var(--maroon);}
.tag-neutral{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--border);}

.status-picker{display:flex; gap:6px; flex-wrap:wrap;}
.status-picker button{
  border:1.5px solid var(--border); background:var(--surface); padding:6px 12px; border-radius:9px;
  font-size:12.5px; cursor:pointer; font-family:inherit; font-weight:600; color:var(--ink-soft);
}
.status-picker button.sel-present.active{background:var(--ok-light); color:var(--ok); border-color:var(--ok);}
.status-picker button.sel-absent.active{background:var(--maroon-light); color:var(--maroon); border-color:var(--maroon);}
.status-picker button.sel-attended_no_recite.active{background:var(--warn-light); color:var(--warn); border-color:var(--warn);}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--primary-dark); color:#fff; padding:12px 22px; border-radius:12px; font-size:13.5px;
  box-shadow:var(--shadow); z-index:999; opacity:0; pointer-events:none; transition:.25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.tabs-inline{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.tabs-inline button{
  border:1.5px solid var(--border); background:var(--surface); padding:8px 16px; border-radius:20px;
  font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; font-family:inherit;
}
.tabs-inline button.active{background:var(--primary); color:#fff; border-color:var(--primary);}

.filter-bar{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px;}
textarea{min-height:80px; resize:vertical;}
.muted{color:var(--ink-soft);}
.small{font-size:12px;}
.mb0{margin-bottom:0;}
.flex{display:flex;}
.gap8{gap:8px;}
.items-center{align-items:center;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="app">
  <div class="splash"><div class="spinner"></div><div>جاري تحميل بيانات الشعبة…</div></div>
</div>

<script>
/* =======================================================================
   شعبة إجازات القرآن الكريم — تطبيق إدارة الحلقات والخطط والتحضير والحصاد
   ======================================================================= */

let DB = { config:{ reciters:[], circles:[], students:[], qiraahOptions:[], planTypes:[], supervisors:[] }, plans:[], attendance:[], harvest:[] };
let session = null;
let ready = false;
let currentTab = null;
let uiState = { confirmId:null };
let addReciterError = '';
let addSupervisorError = '';

// الفترات ثابتة (أوقات الصلاة) — لا يديرها المشرف، بل تُختار عند إنشاء كل حلقة
const PRAYER_PERIODS = [
  {id:'fajr', name:'الفجر'},

  {id:'before_dhuhr', name:'قبل الظهر'},

const CIRCLE_TRACKS = ['مباشر','عن بعد'];

const ATTENDANCE_STATUSES = [
  {val:'حاضر', cls:'present'},
  {val:'غائب', cls:'absent'},
  {val:'حضر ولم يقرئ', cls:'attended_no_recite'}
];
const PRESENT_STATUSES = ['حاضر','حضر ولم يقرئ']; // تُحتسب كحضور فعلي عند تجميع الحصاد تلقائيًا

// بداية كل سورة بحسب ترقيم صفحات المصحف المدني (604 صفحة) — تقريبية للاستخدام كمرجع سريع
const SURAH_PAGE_STARTS = [
  ['الفاتحة',1],['البقرة',2],['آل عمران',50],['النساء',77],['المائدة',106],['الأنعام',128],
  ['الأعراف',151],['الأنفال',177],['التوبة',187],['يونس',208],['هود',221],['يوسف',235],
  ['الرعد',249],['إبراهيم',255],['الحجر',262],['النحل',267],['الإسراء',282],['الكهف',293],
  ['مريم',305],['طه',312],['الأنبياء',322],['الحج',332],['المؤمنون',342],['النور',350],

  ['لقمان',411],['السجدة',415],['الأحزاب',418],['سبأ',428],['فاطر',434],['يس',440],

  ['الملك',562],['القلم',564],['الحاقة',566],['المعارج',568],['نوح',570],['الجن',572],
  ['المزمل',574],['المدثر',575],['القيامة',577],['الإنسان',578],['المرسلات',580],['النبأ',582],
  ['النازعات',583],['عبس',585],['التكوير',586],['الانفطار',587],['المطففين',587],['الانشقاق',589],
  ['البروج',590],['الطارق',591],['الأعلى',591],['الغاشية',592],['الفجر',593],['البلد',594],
  ['الشمس',595],['الليل',595],['الضحى',596],['الشرح',596],['التين',597],['العلق',597],
  ['القدر',598],['البينة',598],['الزلزلة',599],['العاديات',599],['القارعة',600],['التكاثر',600],
  ['العصر',601],['الهمزة',601],['الفيل',601],['قريش',602],['الماعون',602],['الكوثر',602],
  ['الكافرون',603],['النصر',603],['المسد',603],['الإخلاص',604],['الفلق',604],['الناس',604]
];
function surahForPage(page){
  const p = parseInt(page,10);
  if(!p || p<1 || p>604) return '';
  let name = SURAH_PAGE_STARTS[0][0];
  for(const [n,start] of SURAH_PAGE_STARTS){ if(start<=p) name=n; else break; }
  return name;
}

const DEFAULT_QIRAAH_OPTIONS = [
  "حفص عن عاصم",
  "ورش عن نافع",
  "قالون عن نافع",
  "الدوري عن أبي عمرو"
];
const DEFAULT_PLAN_TYPES = [
  "حفظ جديد",
  "مراجعة صغرى (آخر ما تم حفظه)",
  "مراجعة كبرى (جزء كامل)",

  "اختبار تثبيت",
  "تسميع متصل لجزء"
];

function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }


/* ---------------- password hashing (client-side) ---------------- */
// نستخدم SHA-256 عبر Web Crypto عند توفرها (يتطلب فتح الملف عبر https أو من مضيف محلي آمن).
// عند تعذّر ذلك (مثل فتح الملف مباشرة بصيغة file:// في بعض المتصفحات) نستخدم بديلاً بسيطًا
// حتى لا يتعطل تسجيل الدخول، مع العلم أن الحماية الحقيقية تعتمد أيضًا على رمز الحماية (Token).
async function hashPassword(pw){
  try{
    if(window.crypto && window.crypto.subtle){
      const enc = new TextEncoder().encode(pw);
      const buf = await window.crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  // بديل بسيط (غير تشفيري) عند عدم توفر Web Crypto
  let h = 0;
  const s = 'fallback:' + pw;
  for(let i=0;i<s.length;i++){ h = (Math.imul(31,h) + s.charCodeAt(i))|0; }
  return 'fb_' + (h>>>0).toString(16);
}

/* =======================================================================
   طبقة الاتصال بقاعدة البيانات (Google Sheets عبر Google Apps Script)
   ======================================================================= */
// يمكن ترك هذين الثابتين فارغين — سيطلب البرنامج الرابط من المشرف عند أول تشغيل
// ويحفظه في هذا المتصفح/الجهاز. أو يمكن تثبيتهما هنا مباشرة بعد النشر.
const DEFAULT_API_URL = '';
const DEFAULT_API_TOKEN = '';

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }


function queryParam(name){
  try{ return new URLSearchParams(window.location.search).get(name); }catch(e){ return null; }
}

let API = { url:'', token:'' };

function resolveApiConfig(){
  const qUrl = queryParam('api');
  const qToken = queryParam('token');
  if(qUrl){ lsSet('ijazat_api_url', qUrl); if(qToken!==null) lsSet('ijazat_api_token', qToken||''); }
  API.url = lsGet('ijazat_api_url') || DEFAULT_API_URL || '';
  API.token = lsGet('ijazat_api_token') || DEFAULT_API_TOKEN || '';
}

async function apiGet(key){
  try{
    const u = `${API.url}?action=get&key=${encodeURIComponent(key)}${API.token?('&token='+encodeURIComponent(API.token)):''}`;
    const res = await fetch(u);
    if(!res.ok) return null;
    const data = await res.json();
    if(data.error) return null;
    return (data.value!==undefined && data.value!==null && data.value!=='') ? JSON.parse(data.value) : null;
  }catch(e){ return null; }
}
async function apiSet(key, value){
  try{
    const res = await fetch(API.url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'set', key, value: JSON.stringify(value), token: API.token })
    });
    if(!res.ok) return false;
    const data = await res.json();
    return !!data.ok;
  }catch(e){ return false; }
}
async function apiTest(){
  try{
    const u = `${API.url}?action=get&key=__ping__${API.token?('&token='+encodeURIComponent(API.token)):''}`;
    const res = await fetch(u);
    const data = await res.json();
    return !data.error;
  }catch(e){ return false; }
}

// يجلب كل البيانات (config/plans/attendance/harvest) بطلب واحد بدل عدة طلبات — أسرع في الفتح
async function apiGetAll(){
  try{
    const u = `${API.url}?action=getAll${API.token?('&token='+encodeURIComponent(API.token)):''}`;
    const res = await fetch(u);
    if(!res.ok) return null;
    const data = await res.json();
    if(!data.ok) return null;
    const out = {};
    for(const k of ['config','plans','attendance','harvest']){
      const raw = data.data && data.data[k];
      out[k] = (raw!==undefined && raw!==null && raw!=='') ? JSON.parse(raw) : null;
    }
    return out;
  }catch(e){ return null; }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}

async function saveConfig(){ const ok = await apiSet('config', DB.config); if(!ok) showToast('تعذر الحفظ في قاعدة البيانات، تحقق من الاتصال'); return ok; }
async function savePlans(){ const ok = await apiSet('plans', DB.plans); if(!ok) showToast('تعذر حفظ الخطط، تحقق من الاتصال'); return ok; }
async function saveAttendance(){ const ok = await apiSet('attendance', DB.attendance); if(!ok) showToast('تعذر حفظ التحضير، تحقق من الاتصال'); return ok; }
async function saveHarvest(){ const ok = await apiSet('harvest', DB.harvest); if(!ok) showToast('تعذر حفظ الحصاد، تحقق من الاتصال'); return ok; }
function saveSession(){ if(session) lsSet('ijazat_session', JSON.stringify(session)); else lsDel('ijazat_session'); }

let apiConfigured = false;
let apiConnectionError = false;

async function init(){
  resolveApiConfig();
  apiConfigured = !!API.url;
  if(!apiConfigured){ ready = true; render(); return; }

  // طلب واحد يجلب كل البيانات ويؤكد الاتصال معًا (بدل طلب فحص + 4 طلبات منفصلة)
  let all = await apiGetAll();
  if(!all){
    // احتياطي: إن كان الجدول لا يدعم بعد getAll (نسخة كود قديمة)، جرّب الطريقة القديمة
    const ok = await apiTest();
    if(!ok){ apiConnectionError = true; ready = true; render(); return; }
    const [config, plans, attendance, harvest] = await Promise.all([
      apiGet('config'), apiGet('plans'), apiGet('attendance'), apiGet('harvest')
    ]);
    all = {config, plans, attendance, harvest};
  }
  apiConnectionError = false;

  const {config, plans, attendance, harvest} = all;
  DB.config = config || { reciters:[], circles:[], students:[], qiraahOptions:[...DEFAULT_QIRAAH_OPTIONS], planTypes:[...DEFAULT_PLAN_TYPES], supervisors:[] };
  if(!DB.config.qiraahOptions || !DB.config.qiraahOptions.length) DB.config.qiraahOptions = [...DEFAULT_QIRAAH_OPTIONS];
  if(!DB.config.planTypes || !DB.config.planTypes.length) DB.config.planTypes = [...DEFAULT_PLAN_TYPES];
  if(!DB.config.supervisors) DB.config.supervisors = [];
  DB.plans = plans || [];
  DB.attendance = attendance || [];
  DB.harvest = harvest || [];
  try{ session = JSON.parse(lsGet('ijazat_session')||'null'); }catch(e){ session = null; }
  // تحقق أن الحساب المحفوظ محليًا ما زال موجودًا فعليًا في قاعدة البيانات (لم يُحذف)
  if(session){
    if(session.role==='supervisor' && !DB.config.supervisors.find(s=>s.id===session.id)) session=null;
    if(session.role==='reciter' && !DB.config.reciters.find(r=>r.id===session.reciterId)) session=null;
    if(!session) saveSession();
  }
  ready = true;
  currentTab = session ? (session.role==='supervisor' ? 'overview' : 'my-circles') : null;
  render();
}

function attachLoginEvents(){

  const changeLink = document.getElementById('changeConnectionLink');

      e.preventDefault();
      const fd = new FormData(bootstrapForm);
      const name=(fd.get('name')||'').toString().trim();
      const username=(fd.get('username')||'').toString().trim();
      const password=(fd.get('password')||'').toString();

      if(password!==password2){ loginError='كلمتا المرور غير متطابقتين'; render(); return; }
      const passwordHash = await hashPassword(password);
      const rec = {id:uid(), name, username, passwordHash};
      DB.config.supervisors.push(rec);
      await saveConfig();
      session = { role:'supervisor', name:rec.name, id:rec.id };
      saveSession();
      currentTab='overview'; render();
    });
  }

  const form = document.getElementById('loginForm');
  if(form){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const username = (fd.get('username')||'').toString().trim();
      const password = (fd.get('password')||'').toString();
      if(!username||!password){ loginError='يرجى إدخال البريد الإلكتروني أو اسم المستخدم وكلمة المرور'; render(); return; }
      const hash = await hashPassword(password);

      if(loginRole==='supervisor'){
        const acc = DB.config.supervisors.find(s=>s.username===username);
        if(!acc || acc.passwordHash!==hash){ loginError='بيانات الدخول غير صحيحة'; render(); return; }
        session = { role:'supervisor', name:acc.name, id:acc.id };
      }else{
        const r = DB.config.reciters.find(r=>r.username===username);
        if(!r || !r.passwordHash){ loginError='بيانات الدخول غير صحيحة'; render(); return; }

        session = { role:'reciter', name:r.name, reciterId:r.id };
      }
      saveSession();
      currentTab = session.role==='supervisor' ? 'overview' : 'my-circles';
      render();
    });
  }
}

function tplOverview(){
  const c = DB.config;

  const circlesByTrack = t => c.circles.filter(ci=>(ci.track||CIRCLE_TRACKS[0])===t);
  const reciterCountForTrack = t => new Set(circlesByTrack(t).map(ci=>ci.reciterId)).size;
  const studentCountForTrack = t => {
    const circleIds = new Set(circlesByTrack(t).map(ci=>ci.id));
    return c.students.filter(s=>(s.enrollments||[]).some(en=>circleIds.has(en.circleId))).length;
  };

  const usedPeriodIds = new Set(c.circles.flatMap(ci=>ci.periodIds||[]));

  // عدد الطلاب (تسجيلات) لكل قراءة
  const qiraahCounts = {};
  c.students.forEach(s=>(s.enrollments||[]).forEach(en=>{
    if(!en.qiraah) return;
    qiraahCounts[en.qiraah] = (qiraahCounts[en.qiraah]||0)+1;
  }));
  const qiraahRows = Object.entries(qiraahCounts).sort((a,b)=>b[1]-a[1]);

  // إجمالي تقارير الحصاد لكل مسار ولكل فترة (مجموع الحاضرين المرفوع من المقرئين)
  const harvestAgg = {};
  DB.harvest.forEach(h=>{
    const ci = getCircle(h.circleId); if(!ci) return;
    const track = ci.track||CIRCLE_TRACKS[0];
    const key = track+'|'+h.periodId;
    if(!harvestAgg[key]) harvestAgg[key] = {track, periodId:h.periodId, reports:0, present:0};
    harvestAgg[key].reports++;
    harvestAgg[key].present += (h.presentCount||0);
  });
  const harvestRows = Object.values(harvestAgg).sort((a,b)=> a.track.localeCompare(b.track) || (getPeriod(a.periodId)?.name||'').localeCompare(getPeriod(b.periodId)?.name||''));

  return `
  <div class="grid g-4">
    <div class="stat-card"><div class="num">${c.circles.length}</div><div class="lbl">عدد الحلقات</div></div>
    <div class="stat-card"><div class="num">${c.reciters.length}</div><div class="lbl">عدد المقرئين</div></div>
    <div class="stat-card"><div class="num">${c.students.length}</div><div class="lbl">عدد الطلاب</div></div>
    <div class="stat-card"><div class="num">${usedPeriodIds.size} / ${PRAYER_PERIODS.length}</div><div class="lbl">عدد الفترات المستخدمة إجمالًا</div></div>
  </div>

  <div class="arch-divider"><span class="diamond"></span></div>

  <div class="panel">
    <div class="panel-head"><h3>التوزيع حسب المسار</h3></div>
    <table><thead><tr><th>المسار</th><th>عدد الحلقات</th><th>عدد المقرئين</th><th>عدد الطلاب</th></tr></thead><tbody>
      ${CIRCLE_TRACKS.map(t=>`<tr>
        <td><b>${esc(t)}</b></td>
        <td>${circlesByTrack(t).length}</td>
        <td>${reciterCountForTrack(t)}</td>
        <td>${studentCountForTrack(t)}</td>
      </tr>`).join('')}
    </tbody></table>
  </div>

  <div class="grid g-2">
    <div class="panel">
      <div class="panel-head"><h3>عدد الطلاب لكل قراءة</h3></div>
      ${!qiraahRows.length ? emptyState('لا توجد بيانات قراءات بعد','ستظهر هنا بعد تحديد قراءة كل طالب.') : `
      <table><thead><tr><th>القراءة</th><th>عدد التسجيلات</th></tr></thead><tbody>
        ${qiraahRows.map(([q,n])=>`<tr><td>${esc(q)}</td><td>${n}</td></tr>`).join('')}
      </tbody></table>`}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>إجمالي الحصاد لكل فترة ومسار</h3></div>
      ${!harvestRows.length ? emptyState('لا توجد تقارير حصاد بعد','') : `
      <table><thead><tr><th>المسار</th><th>الفترة</th><th>عدد التقارير</th><th>إجمالي الحاضرين</th></tr></thead><tbody>
        ${harvestRows.map(r=>`<tr><td>${esc(r.track)}</td><td>${esc(getPeriod(r.periodId)?.name||'—')}</td><td>${r.reports}</td><td>${r.present}</td></tr>`).join('')}
      </tbody></table>`}
    </div>
  </div>

  <div class="grid g-2">

function buildTemplateWorkbook(){
  const wb = XLSX.utils.book_new();
  const wsR = XLSX.utils.aoa_to_sheet([['الاسم','البريد الإلكتروني/اسم المستخدم','كلمة المرور'],['مثال: محمد العتيبي','mohammed@example.com','1234']]);
  const wsC = XLSX.utils.aoa_to_sheet([['رقم الحلقة','اسم الحلقة','بريد المقرئ','المسار','الفترات'],['12','حلقة التحفيظ الأولى','mohammed@example.com','مباشر','الفجر،العصر']]);
  const wsS = XLSX.utils.aoa_to_sheet([['اسم الطالب','رقم الحلقة','المستوى','أين وصل','القراءة'],['مثال: عبدالله أحمد','12','حافظ 5 أجزاء','سورة الكهف','حفص عن عاصم']]);
  XLSX.utils.book_append_sheet(wb, wsR, 'المقرئون');
  XLSX.utils.book_append_sheet(wb, wsC, 'الحلقات');
  XLSX.utils.book_append_sheet(wb, wsS, 'الطلاب');
  return wb;
}

function findPeriodIdByName(name){
  const n = (name||'').toString().trim();
  const p = PRAYER_PERIODS.find(p=>p.name===n);
  return p ? p.id : null;
}

async function processImportFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const errors = [];
  let addedReciters=0, addedCircles=0, addedStudents=0;

  const getSheetRows = name => {
    const ws = wb.Sheets[name];
    if(!ws) return null;
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    return rows.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));
  };

  const reciterRows = getSheetRows('المقرئون');
  const circleRows = getSheetRows('الحلقات');
  const studentRows = getSheetRows('الطلاب');

  if(reciterRows===null && circleRows===null && studentRows===null){
    errors.push('لم يتم العثور على أي ورقة بالأسماء المطلوبة (المقرئون / الحلقات / الطلاب). تأكد من أسماء الأوراق.');
    return {reciters:0, circles:0, students:0, errors};
  }

  // 1) المقرئون
  (reciterRows||[]).forEach((row, i)=>{
    const name = (row[0]||'').toString().trim();
    const username = (row[1]||'').toString().trim();
    const password = (row[2]||'').toString().trim();
    if(!name || !username || !password){ errors.push(`المقرئون، صف ${i+2}: بيانات ناقصة، تم التجاهل.`); return; }
    if(DB.config.reciters.some(r=>r.username===username)){ errors.push(`المقرئون، صف ${i+2}: البريد "${username}" مستخدم مسبقًا، تم التجاهل.`); return; }
    // كلمة المرور ستُشفّر لاحقًا دفعة واحدة (انظر أدناه)
    DB.config.reciters.push({id:uid(), name, username, passwordHash:null, __pendingPassword:password});
    addedReciters++;
  });

  // 2) الحلقات
  (circleRows||[]).forEach((row, i)=>{
    const number = (row[0]||'').toString().trim();
    const name = (row[1]||'').toString().trim();
    const reciterEmail = (row[2]||'').toString().trim();
    const track = (row[3]||'').toString().trim() || CIRCLE_TRACKS[0];
    const periodsRaw = (row[4]||'').toString().trim();
    if(!number || !name || !reciterEmail){ errors.push(`الحلقات، صف ${i+2}: بيانات ناقصة، تم التجاهل.`); return; }
    const reciter = DB.config.reciters.find(r=>r.username===reciterEmail);
    if(!reciter){ errors.push(`الحلقات، صف ${i+2}: لم يتم إيجاد مقرئ ببريد "${reciterEmail}"، تم التجاهل.`); return; }
    if(DB.config.circles.some(c=>c.number===number)){ errors.push(`الحلقات، صف ${i+2}: رقم الحلقة "${number}" مستخدم مسبقًا، تم التجاهل.`); return; }
    if(!CIRCLE_TRACKS.includes(track)){ errors.push(`الحلقات، صف ${i+2}: قيمة المسار "${track}" غير معروفة، استُخدم "${CIRCLE_TRACKS[0]}" بدلاً منها.`); }
    const periodIds = periodsRaw.split(/[،,]/).map(s=>findPeriodIdByName(s)).filter(Boolean);
    if(periodsRaw && !periodIds.length){ errors.push(`الحلقات، صف ${i+2}: لم يتم التعرف على أي فترة من "${periodsRaw}".`); }
    DB.config.circles.push({id:uid(), name, number, reciterId:reciter.id, track:CIRCLE_TRACKS.includes(track)?track:CIRCLE_TRACKS[0], periodIds});
    addedCircles++;
  });

  // 3) الطلاب
  (studentRows||[]).forEach((row, i)=>{
    const name = (row[0]||'').toString().trim();
    const circleNumber = (row[1]||'').toString().trim();
    const level = (row[2]||'').toString().trim();
    const progress = (row[3]||'').toString().trim();
    const qiraah = (row[4]||'').toString().trim();
    if(!name || !circleNumber){ errors.push(`الطلاب، صف ${i+2}: بيانات ناقصة، تم التجاهل.`); return; }
    const circle = DB.config.circles.find(c=>c.number===circleNumber);
    if(!circle){ errors.push(`الطلاب، صف ${i+2}: لم يتم إيجاد حلقة برقم "${circleNumber}"، تم التجاهل.`); return; }
    DB.config.students.push({id:uid(), name, enrollments:[{circleId:circle.id, level, progress, qiraah}]});
    addedStudents++;
  });

  // تشفير كلمات مرور المقرئين المُضافين دفعة واحدة
  for(const r of DB.config.reciters){
    if(r.__pendingPassword){
      r.passwordHash = await hashPassword(r.__pendingPassword);
      delete r.__pendingPassword;
    }
  }

  if(addedReciters||addedCircles||addedStudents) await saveConfig();
  return {reciters:addedReciters, circles:addedCircles, students:addedStudents, errors};
}

const ABSENCE_ALERT_THRESHOLD = 3;

function tplAlerts(){
  const today = todayStr();

  // 1) طلاب كثيرو الغياب (حسب كل حلقة مسجّلين فيها)
  const absenceRows = [];
  DB.config.students.forEach(s=>{
    (s.enrollments||[]).forEach(en=>{
      const count = absenceDaysCount(s.id, en.circleId);
      if(count >= ABSENCE_ALERT_THRESHOLD){
        absenceRows.push({student:s, circle:getCircle(en.circleId), count});
      }
    });
  });
  absenceRows.sort((a,b)=>b.count-a.count);

  // 2) مقرئون لم يرفعوا الحصاد اليوم
  const noHarvestToday = DB.config.reciters.filter(r=>{
    const circles = circlesOfReciter(r.id);
    if(!circles.length) return false;
    return !DB.harvest.some(h=>h.reciterId===r.id && h.date===today);
  });

  // 3) مقرئون لم يسجلوا التحضير اليوم
  const noAttendanceToday = DB.config.reciters.filter(r=>{
    const circles = circlesOfReciter(r.id);
    if(!circles.length) return false;
    const circleIds = circles.map(c=>c.id);
    return !DB.attendance.some(a=>a.date===today && circleIds.includes(a.circleId));

  return `
  <div class="panel">
    <div class="panel-head"><h3>طلاب كثيرو الغياب</h3><span class="count-badge">${absenceRows.length}</span></div>
    <div class="hint" style="margin:0 0 14px;">يظهر هنا كل طالب بلغ عدد أيام غيابه في حلقة معيّنة ${ABSENCE_ALERT_THRESHOLD} أيام فأكثر، بناءً على التحضير المسجّل من المقرئ.</div>
    ${!absenceRows.length ? emptyState('لا يوجد طلاب متجاوزون لحد الغياب حاليًا','') : `
    <table><thead><tr><th>الطالب</th><th>الحلقة</th><th>عدد أيام الغياب</th></tr></thead><tbody>
      ${absenceRows.map(row=>`<tr>
        <td><b>${esc(row.student.name)}</b></td>
        <td>${esc(row.circle?circleLabel(row.circle):'—')}</td>
        <td><span class="tag tag-red">${row.count}</span></td>
      </tr>`).join('')}
    </tbody></table>`}
  </div>

  <div class="grid g-2">
    <div class="panel">
      <div class="panel-head"><h3>مقرئون لم يرفعوا الحصاد اليوم</h3><span class="count-badge">${noHarvestToday.length}</span></div>
      ${!noHarvestToday.length ? emptyState('الجميع رفعوا الحصاد اليوم','') : `
      <table><thead><tr><th>المقرئ</th><th>عدد الحلقات</th></tr></thead><tbody>
        ${noHarvestToday.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${circlesOfReciter(r.id).length}</td></tr>`).join('')}
      </tbody></table>`}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>مقرئون لم يسجلوا التحضير اليوم</h3><span class="count-badge">${noAttendanceToday.length}</span></div>
      ${!noAttendanceToday.length ? emptyState('الجميع سجّلوا التحضير اليوم','') : `
      <table><thead><tr><th>المقرئ</th><th>عدد الحلقات</th></tr></thead><tbody>

  else if(sub==='attendance') rows = DB.attendance.slice();
  else rows = DB.harvest.slice();

  rows = rows.filter(r=>{
    if(f.circleId && r.circleId!==f.circleId) return false;
    if(f.periodId && r.periodId!==f.periodId) return false;

      if(!c || c.reciterId!==f.reciterId) return false;

  return `

function ensureCtx(){
  const circles = circlesOfReciter(session.reciterId);
  if(!uiState.sessCtx) uiState.sessCtx = {};
  const prevCircleId = uiState.sessCtx.circleId;
  if(!uiState.sessCtx.circleId && circles.length) uiState.sessCtx.circleId = circles[0].id;
  const circle = getCircle(uiState.sessCtx.circleId);
  const availablePeriodIds = circle ? (circle.periodIds||[]) : [];
  // إن تغيّرت الحلقة أو كانت الفترة المختارة لا تنتمي لها، أعد الاختيار لأول فترة متاحة
  if(!uiState.sessCtx.periodId || !availablePeriodIds.includes(uiState.sessCtx.periodId) || prevCircleId!==uiState.sessCtx.circleId){
    uiState.sessCtx.periodId = availablePeriodIds[0] || '';
  }
  if(!uiState.sessCtx.date) uiState.sessCtx.date = todayStr();
}

      <div style="margin-top:16px;"><button class="btn btn-primary" type="submit">حفظ الخطط لهذه الفترة</button></div>
    </form>`}
  </div>

  <div class="panel">
    <div class="panel-head"><h3>السجل اليومي — ${esc(isToday?'اليوم':ctx.date)}</h3><span class="count-badge">${dailyLog.length}</span></div>
    ${!dailyLog.length ? emptyState('لا توجد خطط مسجّلة بهذا التاريخ لهذه الحلقة بعد','') : `
    <table><thead><tr><th>الطالب</th><th>الفترة</th><th>القراءة</th><th>الخطة</th><th>الصفحة</th></tr></thead><tbody>
      ${dailyLog.map(p=>{
        const st = getStudent(p.studentId), pe = getPeriod(p.periodId);
        return `<tr><td><b>${esc(st?.name||'—')}</b></td><td class="muted small">${esc(pe?.name||'—')}</td><td class="small muted">${esc(p.qiraah||'—')}</td><td>${esc(p.planType||'—')}</td><td class="muted">${esc(p.pageNumber??'—')}</td></tr>`;
      }).join('')}
    </tbody></table>`}
  </div>`;
}

function tplReciterAttendance(){
  const circles = circlesOfReciter(session.reciterId);
  if(!circles.length) return `<div class="panel">${emptyState('لا توجد حلقة مرتبطة بك بعد','تواصل مع المشرف لإنشاء حلقتك.')}</div>`;
  ensureCtx();
  const ctx = uiState.sessCtx;
  const students = ctx.circleId ? studentsOfCircle(ctx.circleId) : [];

  return selectorBar() + `
  <div class="panel">
    <div class="panel-head"><h3>تسجيل التحضير — ${esc(ctx.date===todayStr()?'اليوم':ctx.date)}</h3></div>
    ${!ctx.periodId ? emptyState('لا توجد فترة محددة لهذه الحلقة','') :
      !students.length ? emptyState('لا يوجد طلاب في هذه الحلقة','') : `
    <form data-form="save-attendance">
      <table><thead><tr><th>الطالب</th><th>الخطة</th><th>الحالة</th><th>موضع القراءة (رقم الصفحة)</th><th>ملاحظات</th></tr></thead><tbody>
        ${students.map(s=>{
          const existingAtt = DB.attendance.find(a=>a.studentId===s.id && a.circleId===ctx.circleId && a.periodId===ctx.periodId && a.date===ctx.date);
          const existingPlan = DB.plans.find(p=>p.studentId===s.id && p.circleId===ctx.circleId && p.periodId===ctx.periodId && p.date===ctx.date);
          const cur = existingAtt?.status || 'حاضر';
          const curCls = ATTENDANCE_STATUSES.find(st=>st.val===cur)?.cls || 'present';
          const curPage = existingAtt?.pageNumber ?? '';
          const curSurah = existingAtt?.surah || surahForPage(curPage);
          return `<tr>
            <td><b>${esc(s.name)}</b></td>
            <td class="small muted">${existingPlan ? `${esc(existingPlan.planType||'')}${existingPlan.qiraah?' — '+esc(existingPlan.qiraah):''}` : `<span class="tag tag-neutral">لا توجد خطة</span>`}</td>
            <td>
              <input type="hidden" name="status_${s.id}" value="${esc(cur)}">
              <div class="status-picker" data-status-group="${s.id}">
                ${ATTENDANCE_STATUSES.map(st=>`<button type="button" data-status-btn="${s.id}" data-val="${esc(st.val)}" class="sel-${st.cls} ${curCls===st.cls?'active':''}">${esc(st.val)}</button>`).join('')}
              </div>
            </td>
            <td>
              <input type="number" min="1" max="604" name="page_${s.id}" data-page-input="${s.id}" value="${esc(curPage)}" placeholder="رقم الصفحة" style="width:110px;">
              <div class="small muted" data-surah-label="${s.id}" style="margin-top:4px;">${esc(curSurah)}</div>
            </td>
            <td><input type="text" name="note_${s.id}" value="${esc(existingAtt?.note||'')}" placeholder="ملاحظات اختيارية"></td>
          </tr>`;
        }).join('')}
      </tbody></table>
      <div class="hint" style="margin-top:10px;">عند اختيار "حاضر" أو "حضر ولم يقرئ" سيُحتسب الطالب ضمن الحصاد تلقائيًا عند الحفظ، دون الحاجة لرفع حصاد منفصل.</div>
      <div style="margin-top:10px;"><button class="btn btn-primary" type="submit">حفظ التحضير</button></div>
    </form>`}
  </div>`;
}

function tplReciterHarvest(){
  const circles = circlesOfReciter(session.reciterId);
  if(!circles.length) return `<div class="panel">${emptyState('لا توجد حلقة مرتبطة بك بعد','تواصل مع المشرف لإنشاء حلقتك.')}</div>`;
  ensureCtx();
  const ctx = uiState.sessCtx;
  const existing = DB.harvest.find(h=>h.reciterId===session.reciterId && h.circleId===ctx.circleId && h.periodId===ctx.periodId && h.date===ctx.date);
  const myHarvests = DB.harvest.filter(h=>h.reciterId===session.reciterId).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8);

  return selectorBar() + `
  <div class="panel">
    <div class="panel-head"><h3>حصاد الفترة — ${esc(ctx.date===todayStr()?'اليوم':ctx.date)}</h3></div>
    <div class="hint" style="margin:0 0 14px;">يُحتسب عدد الحاضرين والملخص تلقائيًا من صفحة "التحضير" عند حفظها — لا حاجة لإدخالهما هنا يدويًا.</div>
    ${!existing ? emptyState('لم يُسجَّل حصاد لهذه الفترة بعد','سجّل التحضير أولاً من تبويب "التحضير" وسيظهر الحصاد هنا تلقائيًا.') : `
    <div class="grid g-2" style="margin-bottom:14px;">
      <div class="stat-card"><div class="num">${existing.presentCount ?? 0}</div><div class="lbl">عدد الحاضرين (تلقائي)</div></div>
      <div class="stat-card"><div class="num small" style="font-size:14px;line-height:1.6;">${esc(existing.summary||'—')}</div><div class="lbl">ملخص الحاضرين (تلقائي)</div></div>
    </div>
    <form data-form="save-harvest">
      <div class="field"><label>عدد الصفحات / الأجزاء المنجزة (اختياري)</label><input type="text" name="amount" value="${esc(existing?.amount||'')}" placeholder="مثال: 3 أجزاء ونصف"></div>
      <div class="field"><label>ملاحظات إضافية للمشرف (اختياري)</label>
        <textarea name="note" placeholder="أي ملاحظات أخرى">${esc(existing?.note||'')}</textarea>
      </div>
      <button class="btn btn-primary" type="submit">حفظ الملاحظات</button>
    </form>`}
  </div>

  <div class="panel">
    <div class="panel-head"><h3>سجل الحصاد الأخير</h3></div>
    ${!myHarvests.length ? emptyState('لا يوجد سجل حصاد بعد','') : `
    <table><thead><tr><th>الحلقة</th><th>الفترة</th><th>عدد الحاضرين</th><th>الملخص</th><th>التاريخ</th></tr></thead><tbody>
      ${myHarvests.map(h=>{
        const c=getCircle(h.circleId), pe=getPeriod(h.periodId);
        return `<tr><td>${esc(c?circleLabel(c):'—')}</td><td>${esc(pe?.name||'—')}</td><td>${h.presentCount??0}</td><td class="small">${esc((h.summary||'').slice(0,50))}${(h.summary||'').length>50?'…':''}</td><td class="muted small">${esc(h.date)}</td></tr>`;
      }).join('')}
    </tbody></table>`}
  </div>`;
}

/* ======================= EVENT BINDING ======================= */
function pendingConfirm(key, actuallyDo){
  if(uiState.confirmId===key){
    uiState.confirmId=null;
    actuallyDo();
  }else{
    uiState.confirmId=key;
    render();
    setTimeout(()=>{ if(uiState.confirmId===key){ uiState.confirmId=null; render(); } }, 3000);
  }
}

function bindContentEvents(){
  const content = document.getElementById('content');
  if(!content) return;

  content.addEventListener('click', async (e)=>{
    const btn = e.target.closest('[data-action]');
    if(btn){
      const action = btn.dataset.action;

      if(action==='del-reciter'){
        const id = btn.dataset.id;
        pendingConfirm('reciter:'+id, async ()=>{
          DB.config.reciters = DB.config.reciters.filter(r=>r.id!==id);
          const circleIds = DB.config.circles.filter(c=>c.reciterId===id).map(c=>c.id);
          DB.config.circles = DB.config.circles.filter(c=>c.reciterId!==id);
          DB.config.students.forEach(s=>{ s.enrollments = (s.enrollments||[]).filter(en=>!circleIds.includes(en.circleId)); });
          await saveConfig(); showToast('تم حذف المقرئ'); render();
        });
      }
      if(action==='del-circle'){
        const id = btn.dataset.id;
        pendingConfirm('circle:'+id, async ()=>{
          DB.config.circles = DB.config.circles.filter(c=>c.id!==id);
          DB.config.students.forEach(s=>{ s.enrollments = (s.enrollments||[]).filter(en=>en.circleId!==id); });
          await saveConfig(); showToast('تم حذف الحلقة'); render();
        });
      }
      if(action==='circle-track-tab'){
        uiState.circleTrackTab = btn.dataset.track; render();
      }
      if(action==='del-student'){
        const id = btn.dataset.id;
        pendingConfirm('student:'+id, async ()=>{
          DB.config.students = DB.config.students.filter(s=>s.id!==id);
          await saveConfig(); showToast('تم حذف الطالب'); render();
        });
      }
      if(action==='toggle-student'){
        const id = btn.dataset.id;
        uiState.expandedStudent = uiState.expandedStudent===id ? null : id;
        uiState.enrollingStudent = null;
        render();
      }
      if(action==='start-enroll'){
        uiState.enrollingStudent = btn.dataset.id; render();
      }
      if(action==='cancel-enroll'){
        uiState.enrollingStudent = null; render();
      }
      if(action==='del-enrollment'){
        const sid = btn.dataset.sid, cid = btn.dataset.cid;
        const s = getStudent(sid);
        if(s){
          s.enrollments = (s.enrollments||[]).filter(en=>en.circleId!==cid);
          await saveConfig(); showToast('تمت إزالة الطالب من الحلقة'); render();
        }
      }
      if(action==='reset-reciter-pw'){
        uiState.resettingReciter = btn.dataset.id; render();
      }
      if(action==='cancel-reset-reciter'){
        uiState.resettingReciter = null; render();
      }
      if(action==='del-supervisor'){
        const id = btn.dataset.id;
        if(DB.config.supervisors.length<=1) return;
        pendingConfirm('sup:'+id, async ()=>{
          DB.config.supervisors = DB.config.supervisors.filter(s=>s.id!==id);
          await saveConfig(); showToast('تم حذف الحساب'); render();
        });
      }
      if(action==='del-qiraah'){
        const idx = parseInt(btn.dataset.idx,10);
        pendingConfirm('qr:'+idx, async ()=>{
          DB.config.qiraahOptions.splice(idx,1);
          await saveConfig(); showToast('تم حذف القراءة'); render();
        });
      }
      if(action==='del-plan-type'){
        const idx = parseInt(btn.dataset.idx,10);
        pendingConfirm('pt:'+idx, async ()=>{
          DB.config.planTypes.splice(idx,1);
          await saveConfig(); showToast('تم حذف نوع الخطة'); render();
        });
      }
      if(action==='download-template'){
        try{
          const wb = buildTemplateWorkbook();
          XLSX.writeFile(wb, 'نموذج_استيراد_شعبة_الإجازات.xlsx');
        }catch(err){ showToast('تعذر إنشاء النموذج'); }
      }
      if(action==='run-import'){
        if(!uiState.importFileObj || uiState.importing) return;
        uiState.importing = true; render();
        try{
          const result = await processImportFile(uiState.importFileObj);
          uiState.importResult = result;
          showToast('اكتمل الاستيراد: '+(result.reciters+result.circles+result.students)+' سجل');
        }catch(err){
          uiState.importResult = {reciters:0, circles:0, students:0, errors:['تعذّرت قراءة الملف. تأكد أنه بصيغة xlsx صحيحة.']};
        }
        uiState.importing = false;
        uiState.importFileObj = null;
        render();
      }
      if(action==='track-sub'){
        uiState.trackSub = btn.dataset.sub; render();
      }
      return;
    }

    const statusBtn = e.target.closest('[data-status-btn]');
    if(statusBtn){
      const sid = statusBtn.dataset.statusBtn;
      const val = statusBtn.dataset.val;
      const group = content.querySelector(`[data-status-group="${sid}"]`);
      group.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      statusBtn.classList.add('active');
      const hidden = content.querySelector(`input[name="status_${sid}"]`);
      if(hidden) hidden.value = val;
    }
  });

  content.addEventListener('change', (e)=>{
    const filt = e.target.closest('[data-filter]');
    if(filt){
      uiState.trackFilter = uiState.trackFilter || {};
      uiState.trackFilter[filt.dataset.filter] = filt.value;
      render(); return;
    }
    const ctx = e.target.closest('[data-ctx]');
    if(ctx){
      uiState.sessCtx = uiState.sessCtx || {};
      uiState.sessCtx[ctx.dataset.ctx] = ctx.value;
      render(); return;
    }
    const importFile = e.target.closest('[data-import-file]');
    if(importFile){
      uiState.importFileObj = importFile.files && importFile.files[0] ? importFile.files[0] : null;
      render(); return;
    }
  });

  content.addEventListener('input', (e)=>{
    const pageInput = e.target.closest('[data-page-input]');
    if(pageInput){
      const sid = pageInput.dataset.pageInput;
      const label = content.querySelector(`[data-surah-label="${sid}"]`);
      if(label) label.textContent = surahForPage(pageInput.value);
    }
  });

  content.addEventListener('submit', async (e)=>{
    const form = e.target.closest('form[data-form]');
    if(!form) return;
    e.preventDefault();
    const type = form.dataset.form;
    const fd = new FormData(form);

    if(type==='add-reciter'){
      const name = (fd.get('name')||'').toString().trim();
      const username = (fd.get('username')||'').toString().trim();
      const password = (fd.get('password')||'').toString();
      addReciterError = '';
      if(!name||!username||!password){ addReciterError='يرجى تعبئة جميع الحقول'; render(); return; }
      if(DB.config.reciters.some(r=>r.username===username)){ addReciterError='هذا البريد الإلكتروني/اسم المستخدم مستخدم بالفعل، اختر قيمة أخرى'; render(); return; }
      const passwordHash = await hashPassword(password);
      DB.config.reciters.push({id:uid(), name, username, passwordHash});
      await saveConfig(); showToast('تمت إضافة المقرئ'); render();
    }
    if(type==='reset-reciter-pw'){
      const id = fd.get('id');
      const password = (fd.get('password')||'').toString();
      if(!password) return;
      const r = DB.config.reciters.find(x=>x.id===id);
      if(r){ r.passwordHash = await hashPassword(password); await saveConfig(); showToast('تم تحديث كلمة المرور'); }
      uiState.resettingReciter = null; render();
    }
    if(type==='add-supervisor'){
      const name=(fd.get('name')||'').toString().trim();
      const username=(fd.get('username')||'').toString().trim();
      const password=(fd.get('password')||'').toString();
      addSupervisorError='';
      if(!name||!username||!password){ addSupervisorError='يرجى تعبئة جميع الحقول'; render(); return; }
      if(DB.config.supervisors.some(s=>s.username===username)){ addSupervisorError='هذا البريد الإلكتروني/اسم المستخدم مستخدم بالفعل، اختر قيمة أخرى'; render(); return; }
      const passwordHash = await hashPassword(password);
      DB.config.supervisors.push({id:uid(), name, username, passwordHash});
      await saveConfig(); showToast('تمت إضافة حساب المشرف'); render();
    }
    if(type==='add-circle'){
      const name=(fd.get('name')||'').toString().trim();
      const number=(fd.get('number')||'').toString().trim();
      const reciterId=fd.get('reciterId');
      const track=(fd.get('track')||CIRCLE_TRACKS[0]).toString();
      const periodIds = fd.getAll('periodIds');
      if(!name||!reciterId||!number) return;
      DB.config.circles.push({id:uid(), name, number, reciterId, track, periodIds});
      await saveConfig(); showToast('تم إنشاء الحلقة'); render();
    }
    if(type==='add-student'){
      const name=(fd.get('name')||'').toString().trim();
      const circleId=fd.get('circleId');
      const level=(fd.get('level')||'').toString().trim();
      const progress=(fd.get('progress')||'').toString().trim();
      const qiraah=(fd.get('qiraah')||'').toString().trim();
      if(!name||!circleId) return;
      DB.config.students.push({id:uid(), name, enrollments:[{circleId, level, progress, qiraah}]});
      await saveConfig(); showToast('تمت إضافة الطالب'); render();
    }
    if(type==='add-enrollment'){
      const studentId=fd.get('studentId');
      const circleId=fd.get('circleId');
      const level=(fd.get('level')||'').toString().trim();
      const progress=(fd.get('progress')||'').toString().trim();
      const qiraah=(fd.get('qiraah')||'').toString().trim();
      if(!studentId||!circleId) return;
      const s = getStudent(studentId);
      if(s){
        s.enrollments = s.enrollments||[];
        if(!s.enrollments.some(en=>en.circleId===circleId)) s.enrollments.push({circleId, level, progress, qiraah});
        await saveConfig(); showToast('تمت إضافة الطالب للحلقة'); 
      }
      uiState.enrollingStudent = null; render();
    }
    if(type==='add-qiraah'){
      const text=(fd.get('text')||'').toString().trim();
      if(!text) return;
      DB.config.qiraahOptions.push(text);
      await saveConfig(); showToast('تمت الإضافة'); render();
    }
    if(type==='add-plan-type'){
      const text=(fd.get('text')||'').toString().trim();
      if(!text) return;
      DB.config.planTypes.push(text);
      await saveConfig(); showToast('تمت الإضافة'); render();
    }
    if(type==='save-plans'){
      const ctx = uiState.sessCtx;
      const students = studentsOfCircle(ctx.circleId);
      let count=0;
      students.forEach(s=>{
        const qiraah = fd.get('qiraah_'+s.id) || '';
        const planType = fd.get('plan_'+s.id);
        const pageRaw = fd.get('page_'+s.id);
        const idx = DB.plans.findIndex(p=>p.studentId===s.id && p.circleId===ctx.circleId && p.periodId===ctx.periodId && p.date===ctx.date);
        if(!planType){
          if(idx>-1) DB.plans.splice(idx,1);
          return;
        }
        count++;
        const rec = {id: idx>-1?DB.plans[idx].id:uid(), studentId:s.id, circleId:ctx.circleId, periodId:ctx.periodId, date:ctx.date, qiraah, planType, pageNumber: pageRaw? parseInt(pageRaw,10): null, setBy:session.name};
        if(idx>-1) DB.plans[idx]=rec; else DB.plans.push(rec);
      });
      await savePlans(); showToast('تم حفظ الخطط ('+count+')'); render();
    }
    if(type==='save-attendance'){
      const ctx = uiState.sessCtx;
      const students = studentsOfCircle(ctx.circleId);
      const presentEntries = []; // لتوليد ملخص الحصاد تلقائيًا
      students.forEach(s=>{
        const status = fd.get('status_'+s.id) || 'حاضر';
        const note = fd.get('note_'+s.id) || '';
        const pageRaw = fd.get('page_'+s.id);
        const pageNumber = pageRaw? parseInt(pageRaw,10): null;
        const surah = pageNumber? surahForPage(pageNumber): '';
        const idx = DB.attendance.findIndex(a=>a.studentId===s.id && a.circleId===ctx.circleId && a.periodId===ctx.periodId && a.date===ctx.date);
        const rec = {id: idx>-1?DB.attendance[idx].id:uid(), studentId:s.id, circleId:ctx.circleId, periodId:ctx.periodId, date:ctx.date, status, note, pageNumber, surah, recordedBy:session.name};
        if(idx>-1) DB.attendance[idx]=rec; else DB.attendance.push(rec);
        if(PRESENT_STATUSES.includes(status)){
          presentEntries.push(`${s.name}${pageNumber?` (صفحة ${pageNumber}${surah?' — '+surah:''})`:''}`);
        }
      });
      await saveAttendance();

      // توليد/تحديث سجل الحصاد تلقائيًا من نتائج التحضير — دون الحاجة لرفع منفصل
      const hIdx = DB.harvest.findIndex(h=>h.reciterId===session.reciterId && h.circleId===ctx.circleId && h.periodId===ctx.periodId && h.date===ctx.date);
      const hRec = {
        id: hIdx>-1?DB.harvest[hIdx].id:uid(),
        reciterId: session.reciterId, circleId: ctx.circleId, periodId: ctx.periodId, date: ctx.date,
        presentCount: presentEntries.length,
        amount: hIdx>-1?(DB.harvest[hIdx].amount||''):'',
        summary: presentEntries.length? ('الحاضرون: '+presentEntries.join('، ')) : '',
        note: hIdx>-1?(DB.harvest[hIdx].note||''):'',
        autoGenerated: true
      };
      if(hIdx>-1) DB.harvest[hIdx]=hRec; else DB.harvest.push(hRec);
      await saveHarvest();

      showToast('تم حفظ التحضير، وتحديث الحصاد تلقائيًا'); render();
    }
    if(type==='save-harvest'){
      const ctx = uiState.sessCtx;
      const amount = fd.get('amount');
      const note = fd.get('note');
      const idx = DB.harvest.findIndex(h=>h.reciterId===session.reciterId && h.circleId===ctx.circleId && h.periodId===ctx.periodId && h.date===ctx.date);
      const rec = {
        id: idx>-1?DB.harvest[idx].id:uid(),
        reciterId: session.reciterId, circleId: ctx.circleId, periodId: ctx.periodId, date: ctx.date,
        presentCount: idx>-1?DB.harvest[idx].presentCount:0,
        amount: amount||'', summary: idx>-1?DB.harvest[idx].summary:'', note: note||''
      };
      if(idx>-1) DB.harvest[idx]=rec; else DB.harvest.push(rec);
      await saveHarvest(); showToast('تم حفظ الملاحظات'); render();
    }
  });
}

init();
